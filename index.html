[/violette/i,"#7E6BB2"],[/m[ûu]re|cassis/i,"#5E2350"],[/lampone|granatina|fragola/i,"#C22B44"],
[/cherry heering|maraschino/i,"#9A2130"],[/lillet/i,"#EBDCB6"],
[/triple sec|cointreau|cura[çc]ao/i,"#EDE3C6"],[/rum scuro/i,"#6E3A1B"],
[/rum giamaicano|rum agricole/i,"#C87C27"],[/whisk|bourbon|rye|scotch|islay/i,"#BC6A18"],
[/cognac|brandy/i,"#A9531B"],[/gin|vodka|rum bianco|cacha[çc]a|tequila|pisco|sherry/i,"#E7DFBB"],
[/prosecco|champagne|cava/i,"#F0DFA0"],[/ginger beer|birra/i,"#DAA338"],[/cola/i,"#3A2210"],
[/soda|tonica|acqua/i,"#CADEE2"],[/lime/i,"#AEC456"],[/limone/i,"#E6D95F"],
[/arancia|mandarino/i,"#EE8A18"],[/pompelmo/i,"#EE9077"],[/ananas/i,"#F0CE78"],
[/mirtillo/i,"#9E2549"],[/pomodoro/i,"#BB3517"],[/pesca/i,"#F3B673"],[/sorbetto/i,"#F5F0D4"],
[/panna|cocco|albume|cacao/i,"#F4ECD8"],[/menta/i,"#57A64B"],
[/angostura|peychaud|worcester|tabasco|salsa|bitter/i,"#3E1A10"],[/miele|zenzero/i,"#DAA338"],
[/sciroppo|zucchero|orzata|sambuco|cordial/i,"#DCCF98"]];
const tinta=n=>{for(const[r,c]of TINTE) if(r.test(n)) return c; return "#8C8272";};

/* ---------- utilità colore ---------- */
function hx(c){const h=c.replace("#","");return[parseInt(h.substr(0,2),16),
  parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
const rgb=a=>"#"+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
const schiara=(c,k)=>rgb(hx(c).map(v=>v+(255-v)*k));
const scurisce=(c,k)=>rgb(hx(c).map(v=>v*(1-k)));
const luce=c=>{const[r,g,b]=hx(c).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*r+.7152*g+.0722*b;};

/* colori portanti del drink, dal più abbondante */
function palette(c){
  const pesi=c.ing.map(x=>({c:tinta(x.i),p:x.u==="ml"?(+x.q||0):8}))
    .sort((a,b)=>b.p-a.p).map(x=>x.c);
  const u=[...new Set(pesi)];
  return [u[0]||"#B98A4A", u[1]||u[0]||"#B98A4A", u[2]||u[1]||u[0]||"#B98A4A"];
}
/* quanto ogni ingrediente tinge davvero: i distillati chiari sono trasparenti */
const PIGMENTO=[
 [/soda|tonica|acqua|cava|prosecco|champagne/i,.12],
 [/gin|vodka|rum bianco|cacha[çc]a|tequila|pisco|sherry|triple sec|cointreau|maraschino/i,.16],
 [/sciroppo|zucchero|orzata|lillet|cordial|albume/i,.3],
 [/succo di lime|succo di limone|succo di pompelmo/i,.5],
 [/panna|cocco|sorbetto|purea/i,1.1],
 [/espresso|caff|cola|assenzio|bitter|angostura|peychaud|worcester|tabasco/i,2.6],
 [/campari|aperol|granatina|violette|m[ûu]re|cassis|menta|cherry|maraschino|amaro|vermouth rosso/i,1.9]
];
const pigmento=n=>{for(const[r,f]of PIGMENTO) if(r.test(n)) return f; return 1;};
/* colore del liquido: media pesata su volume E potere colorante */
function liquido(c){
  let r=0,g=0,b=0,t=0;
  c.ing.forEach(x=>{
    const vol=x.u==="ml"?(+x.q||0):(x.u==="dash"?2:x.u==="foglie"?4:8);
    const p=vol*pigmento(x.i);
    if(!p) return; const[a,s,d]=hx(tinta(x.i)); r+=a*p;g+=s*p;b+=d*p;t+=p;});
  return t?rgb([r/t,g/t,b/t]):"#C08A3E";
}
/* ambiente dietro al bicchiere */
function ambiente(c){
  const[a,b]=palette(c), l=liquido(c);
  return `radial-gradient(120% 96% at 22% 6%, ${schiara(a,.34)} 0%, transparent 56%),
    radial-gradient(96% 84% at 92% 26%, ${schiara(b,.16)} 0%, transparent 58%),
    linear-gradient(152deg, ${scurisce(l,.28)} 0%, ${scurisce(l,.58)} 58%, ${scurisce(l,.74)} 100%)`;
}

/* ---------- ghiaccio ---------- */
function ghiaccio(c,V,ltop){
  const g=(c.gh||"").toLowerCase();
  if(/senza/.test(g)||!V.gh.length) return "";
  const tritato=/tritat/.test(g);
  let out="";
  if(tritato){
    for(let i=0;i<16;i++){
      const x=100+(Math.sin(i*2.7)*V.rx*.6), y=ltop+8+((i*13)%Math.max(20,(V.lb-ltop-14)));
      out+=`<rect x="${x-7}" y="${y-7}" width="14" height="14" rx="3" fill="#FFFFFF"
        opacity="${.16+(i%3)*.07}" transform="rotate(${(i*37)%80-40} ${x} ${y})"/>`;
    }
  } else {
    V.gh.forEach(([x,y,s],i)=>{
      if(y<ltop-6) return;
      out+=`<g transform="rotate(${[-14,12,-6,18][i%4]} ${x} ${y})">
        <rect x="${x-s/2}" y="${y-s/2}" width="${s}" height="${s}" rx="${s*.22}"
          fill="#FFFFFF" opacity=".26"/>
        <rect x="${x-s/2}" y="${y-s/2}" width="${s}" height="${s}" rx="${s*.22}"
          fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.6"/>
        <path d="M${x-s/2+4} ${y-s/2+5} L${x-s/2+s*.42} ${y-s/2+4}" stroke="#fff"
          stroke-opacity=".7" stroke-width="2.4" stroke-linecap="round"/></g>`;
    });
  }
  return out;
}

/* ---------- guarnizione ---------- */
function guarnizione(c,V){
  const g=(c.gar||"").toLowerCase(), gx=100+V.rx*.66, gy=V.ry-2;
  let out="";
  if(/scorza|twist/.test(g)&&/arancia/.test(g))
    out=`<path d="M${gx} ${gy} c 20 -18 40 0 32 18 c -7 15 -28 12 -28 -4"
      stroke="#F0871C" stroke-width="10" fill="none" stroke-linecap="round"/>`;
  else if(/fetta d'arancia|ruota d'arancia|arancia/.test(g))

/* ---------- il bicchiere disegnato ---------- */
function vetro(c,{liv=1,uid="v"}={}){
  const V=formaDi(c), L=liquido(c), P=palette(c);
  const alto=V.lb-(V.lb-V.lt)*Math.max(0,Math.min(1,liv));
  const pieno=liv>.02;
  return `<svg class="vetro" viewBox="0 0 200 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="c${uid}"><path d="${V.d}"/></clipPath>
    <linearGradient id="l${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${schiara(P[0],.22)}"/>
      <stop offset=".45" stop-color="${L}"/>
      <stop offset="1" stop-color="${scurisce(P[1]||L,.24)}"/></linearGradient>
    <linearGradient id="g${uid}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
      <stop offset=".22" stop-color="#fff" stop-opacity=".07"/>
      <stop offset=".78" stop-color="#fff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".24"/></linearGradient>
  </defs>
  <ellipse cx="104" cy="200" rx="${V.rx+16}" ry="9" fill="#000" opacity=".2"/>
  ${V.manico?`<path d="${V.manico}" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="9"
    fill="none" stroke-linecap="round"/>`:""}
  <path d="${V.d}" fill="url(#g${uid})"/>
  <g clip-path="url(#c${uid})">
    ${pieno?`<rect x="0" y="${alto}" width="200" height="220" fill="url(#l${uid})"/>
      <ellipse cx="100" cy="${alto}" rx="70" ry="${V.el*.8}" fill="${schiara(L,.3)}" opacity=".85"/>`:""}
    ${pieno?ghiaccio(c,V,alto):""}
    <path d="M${100-V.rx*.72} ${V.ry+6} L${100-V.rx*.5} 190" stroke="#fff" stroke-opacity=".4"
      stroke-width="6" stroke-linecap="round"/>
  </g>
  <path d="${V.d}" fill="none" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="3.2"
    stroke-linejoin="round"/>
  <ellipse cx="100" cy="${V.ry}" rx="${V.rx}" ry="${V.el}" fill="none" stroke="#FFFFFF"
    stroke-opacity=".9" stroke-width="3.2"/>
  ${V.stelo?`<path d="${V.stelo}" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="5"
    stroke-linecap="round"/>`:""}
  ${V.piede?`<ellipse cx="100" cy="${V.piede.cy}" rx="${V.piede.rx}" ry="${V.piede.ry}"
    fill="#FFFFFF" fill-opacity=".2" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="3.2"/>`:""}
  ${pieno?guarnizione(c,V):""}
</svg>`;
}

/* ===================== archivio locale =====================
   Dentro l'anteprima esiste window.storage. Fuori (browser, PWA, Android)
   non c'e: senza questo innesto ogni salvataggio lancia un errore e blocca
   la schermata. Qui ripiego su localStorage, che funziona ovunque. */
if(!window.storage){
  const ok=(()=>{try{localStorage.setItem("_p","1");localStorage.removeItem("_p");return true}
    catch(e){return false}})();
  const finto={};
  window.storage={
    get:k=>Promise.resolve(
      (()=>{const v=ok?localStorage.getItem(k):(finto[k]??null);
        return v===null||v===undefined?null:{key:k,value:v};})()),
    set:(k,v)=>{try{ok?localStorage.setItem(k,v):(finto[k]=v);}catch(e){}
      return Promise.resolve({key:k,value:v});},
    delete:k=>{try{ok?localStorage.removeItem(k):delete finto[k];}catch(e){}
      return Promise.resolve({key:k,deleted:true});}
  };
}

/* t("chiave",{n:3}) — se manca la traduzione, ripiega sull'italiano */
function t(k,v){
  let s=(DIZ[LG]&&DIZ[LG][k]) || DIZ.it[k] || k;
  if(v) for(const c in v) s=s.split("{"+c+"}").join(v[c]);
  return s;
}
/* traduzione del vocabolario dei cocktail */
function v(parola){
  if(LG==="it"||!parola) return parola;
  const d=VOC[parola]||VOC2[parola];
  return (d&&d[LG])||parola;
}
const unita=u=>{ if(LG==="it") return u; const d=VOC2[u]; return (d&&d[LG])||u; };
/* plurali: russo e lituano hanno tre forme, le altre due */
function formaPlurale(n){
  n=Math.abs(Math.round(n));
  if(LG==="ru"){
    const d=n%10, c=n%100;
    if(d===1 && c!==11) return 0;
    if(d>=2 && d<=4 && !(c>=12&&c<=14)) return 1;
    return 2;
  }
  if(LG==="lt"){
    const d=n%10, c=n%100;
    if(d===1 && c!==11) return 0;
    if(d>=2 && d<=9 && !(c>=11&&c<=19)) return 1;
    return 2;
  }
  return n===1?0:1;
}
/* pl(3,"pl_passi") -> "3 passi" nella forma giusta */
function pl(n,chiave){
  const f=(DIZ[LG]&&DIZ[LG][chiave])||DIZ.it[chiave]||[chiave];
  const i=Math.min(formaPlurale(n), f.length-1);
  return n+" "+f[i];
}

function carica(url,tipo){
  return new Promise((ok,ko)=>{
    if(document.querySelector(`[data-risorsa="${url}"]`)){ok();return;}
    const e=tipo==="css"?document.createElement("link"):document.createElement("script");
    if(tipo==="css"){e.rel="stylesheet";e.href=url;} else {e.src=url;e.defer=true;}
    e.setAttribute("data-risorsa",url);
    e.onload=ok; e.onerror=()=>ko(new Error("risorsa"));
    document.head.appendChild(e);
  });
}
const distanza=(a,b,c,d)=>{
  const R=6371000, r=x=>x*Math.PI/180;
  const dl=r(c-a), dg=r(d-b);
  const x=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dg/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
};

/* a quale categoria appartiene, leggendo i tag di OpenStreetMap */
function categoria(g){
  if(!g) return "bar";
  const testo=[g.name,g.cuisine,g["bar:type"],g.drink,g.amenity,g.craft,g.shop]
    .filter(Boolean).join(" ").toLowerCase();
  if(g.amenity==="nightclub") return "night";
  if(g.amenity==="biergarten"||/microbrewery|brewpub|birrific|birreria/.test(testo)) return "birra";
  if(g.amenity==="cafe") return "caffe";
  if(/cocktail|mixolog|speakeasy|american bar/.test(testo)) return "cocktail";
  if(/wine|vino|enote|vineria|winery/.test(testo)) return "wine";
  if(g.amenity==="pub") return "pub";
  if(/beer|birra|pils|craft/.test(testo)) return "birra";
  return "bar";
}

/* apre adesso? interpreta gli orari di OpenStreetMap */
function apertoOra(orari){
  if(!orari) return null;
  if(/24\/7/.test(orari)) return true;
  const g=["Su","Mo","Tu","We","Th","Fr","Sa"][new Date().getDay()];
  const ora=new Date().getHours()*60+new Date().getMinutes();
  let visto=false;
  for(const pezzo of orari.split(";")){
    const m=pezzo.trim().match(/^([A-Za-z,\-]+)?\s*([0-9:,\-\s]+)$/);
    if(!m) continue;
    const giorni=m[1]||"Mo-Su";
    if(giorni.indexOf(g)<0 && !/-/.test(giorni)) continue;
    visto=true;
    for(const f of m[2].split(",")){
      const o=f.trim().match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
      if(!o) continue;
      let a=+o[1]*60+ +o[2], b=+o[3]*60+ +o[4];
      if(b<a) b+=1440;
      if(ora>=a && ora<=b) return true;
      if(ora+1440>=a && ora+1440<=b) return true;
    }
  }
  return visto?false:null;
}

/* ---------- che cosa sappiamo del posto, dai tag di OpenStreetMap ---------- */
const PREGI=[
  [g=>g.outdoor_seating==="yes","pregio_fuori","sedia"],
  [g=>/wlan|yes/.test(g.internet_access||""),"pregio_wifi","wifi"],
  [g=>g.live_music==="yes"||g.music==="live","pregio_musica","nota"],
  [g=>g.craft_beer==="yes"||g.microbrewery==="yes"||g.brewery,"pregio_artigianale","luppolo"],
  [g=>g.wheelchair==="yes","pregio_accesso","accesso"],
  [g=>g.food==="yes"||g.cuisine,"pregio_cucina","posate"],
  [g=>g.smoking==="outside"||g.smoking==="separated","pregio_fumo","fumo"],
  [g=>g.happy_hour==="yes"||/aperitivo/i.test(g.name||""),"pregio_aperitivo","calice"],
  [g=>g.reservation==="required","pregio_prenota","biglietto"],
  [g=>g.takeaway==="yes","pregio_asporto","sacco"]
];
const pregiDi=g=>PREGI.filter(([f])=>{try{return f(g||{})}catch(e){return false}})
  .map(([,k,i])=>({testo:t(k),ico:i}));


async function cercaLocali(){
  const q=`[out:json][timeout:24];
    ( node["amenity"~"^(bar|pub|nightclub|biergarten|cafe)$"](around:${RAGGIO},${DOVE.lat},${DOVE.lon});
      way["amenity"~"^(bar|pub|nightclub|biergarten)$"](around:${RAGGIO},${DOVE.lat},${DOVE.lon});
    ); out center tags 140;`;
  const server=["https://overpass-api.de/api/interpreter",
                "https://overpass.kumi.systems/api/interpreter"];
  let dati=null;
  for(const s of server){
    try{
      const r=await fetch(s,{method:"POST",body:"data="+encodeURIComponent(q)});
      if(!r.ok) continue;
      dati=await r.json(); break;
    }catch(e){}
  }
  if(!dati) throw new Error("rete");
  return (dati.elements||[]).map(e=>{
    const lat=e.lat??e.center?.lat, lon=e.lon??e.center?.lon, g=e.tags||{};
    if(!lat||!lon||!g.name) return null;
    const cat=categoria(g);
    /* i caffè entrano solo se sanno di cocktail o di sera */
    if(g.amenity==="cafe" && cat==="caffe" && !/cocktail|bar/i.test(g.name)) return null;
    return {
      id:e.id, nome:g.name, lat, lon, cat, tag:g,
      via:[g["addr:street"],g["addr:housenumber"]].filter(Boolean).join(" ")||g["addr:city"]||"",
      orari:g.opening_hours||"", tel:g.phone||g["contact:phone"]||"",
      sito:g.website||g["contact:website"]||"",
      testo:g["description:it"]||g.description||"",
      pregi:pregiDi(g),
      d:distanza(DOVE.lat,DOVE.lon,lat,lon)
    };
  }).filter(Boolean).sort((a,b)=>a.d-b.d);
}

D.bere=async()=>{
  if(MAPPA){ try{MAPPA.remove();}catch(e){} MAPPA=null; MARCATORI=[]; }
  const stato=$("mstato"), lista=$("mlista"), conta=$("mconta"), barra=$("mfiltri");
  if(!stato||!lista||!conta||!barra) return;

  const errore=(testo,riprova)=>{
    stato.innerHTML=`<p>${testo}</p>`+
      (riprova?`<button class="cta bianca" id="mriprova" style="width:auto;padding:0 26px;
        height:46px;margin-top:14px">${t("mappa_riprova")}</button>`:"");
    stato.classList.add("visibile");
    const b=$("mriprova"); if(b) b.onclick=()=>{stato.classList.remove("visibile");avvia();};
  };

  async function avvia(){
    if(CARICANDO) return; CARICANDO=true;
    stato.innerHTML=`<div class="giro"></div><p>${t("mappa_cerco")}</p>`;
    stato.classList.add("visibile");
    try{
      if(!navigator.onLine) throw {tipo:"rete"};
      await Promise.all([
        carica("https://unpkg.com/leaflet@1.9.4/dist/leaflet.css","css"),
        carica("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js","js")
      ]);
      if(!DOVE) DOVE=await new Promise((ok,ko)=>{
        if(!navigator.geolocation) return ko({tipo:"pos"});
        navigator.geolocation.getCurrentPosition(
          p=>ok({lat:p.coords.latitude,lon:p.coords.longitude}),
          ()=>ko({tipo:"pos"}),
          {enableHighAccuracy:true,timeout:12000,maximumAge:120000});
      });
      stato.innerHTML=`<div class="giro"></div><p>${t("mappa_carico")}</p>`;
      LOCALI=await cercaLocali();
      disegnaFiltri(); disegna();
      stato.classList.remove("visibile");
    }catch(e){
      if(e&&e.tipo==="pos") errore(t("mappa_noperm"),true);
      else errore(t("mappa_offline"),true);
    }finally{ CARICANDO=false; }
  }

  /* ---- la fila dei filtri, solo con le categorie davvero presenti ---- */
  function disegnaFiltri(){
    const presenti=[...new Set(LOCALI.map(p=>p.cat))]
      .sort((a,b)=>Object.keys(CAT).indexOf(a)-Object.keys(CAT).indexOf(b));
    const quanti=k=>LOCALI.filter(p=>p.cat===k).length;
    barra.innerHTML=
      `<button class="catf" data-cat="" aria-pressed="${FILTRI.size===0}">
         <span class="pal">${t("tutti")}</span><i>${LOCALI.length}</i></button>`+
      presenti.map(k=>`<button class="catf" data-cat="${k}" style="--c:${CAT[k].c}"
         aria-pressed="${FILTRI.has(k)}">${catIco(k,16)}<span class="pal">${t(CAT[k].k)}</span>
         <i>${quanti(k)}</i></button>`).join("");
    barra.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
      const k=b.dataset.cat;
      if(!k) FILTRI.clear();
      else { FILTRI.has(k)?FILTRI.delete(k):FILTRI.add(k); }
      tocco("lieve"); disegnaFiltri(); disegna();
    });
  }
  const visibili=()=>FILTRI.size? LOCALI.filter(p=>FILTRI.has(p.cat)) : LOCALI;

  function disegna(){
    const elenco=visibili();
    if(!MAPPA){
      MAPPA=L.map("mappa",{zoomControl:false,attributionControl:true})
        .setView([DOVE.lat,DOVE.lon],15);
      /* Base scura vera di Esri: libera, senza chiave. I tasselli di OSM
         rovesciati in negativo davano un nero piatto senza strade leggibili. */
      const base=L.tileLayer(
        "https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
        {maxZoom:16,maxNativeZoom:16,
         attribution:'Esri &middot; &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
      base.addTo(MAPPA);
      /* strato separato per i nomi delle vie, cosi restano nitidi */
      L.tileLayer(
        "https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}",
        {maxZoom:16,maxNativeZoom:16,opacity:.9,pane:"shadowPane"}).addTo(MAPPA);
      /* se Esri non risponde, si ripiega su OpenStreetMap scurito via CSS */
      let caduti=0;
      base.on("tileerror",()=>{ if(++caduti===4){
        document.getElementById("mappa").classList.add("ripiego");
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,
          attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(MAPPA); }});
      L.control.zoom({position:"bottomright"}).addTo(MAPPA);
    }
    MARCATORI.forEach(m=>MAPPA.removeLayer(m)); MARCATORI=[];
    const io=L.marker([DOVE.lat,DOVE.lon],{icon:L.divIcon({className:"",
      iconSize:[26,26],iconAnchor:[13,13],html:'<div class="qui"><i></i><b></b></div>'}),
      interactive:false,zIndexOffset:-500}).addTo(MAPPA);
    MARCATORI.push(io);

    elenco.forEach((p,i)=>{
      const C=CAT[p.cat];
      const ic=L.divIcon({className:"",iconSize:[38,46],iconAnchor:[19,44],
        html:`<div class="spillo" style="--a:${C.c}">
                <span class="sg">${catIco(p.cat,15)}</span>
                <b>${i+1}</b></div>`});
      const m=L.marker([p.lat,p.lon],{icon:ic}).addTo(MAPPA);
      m.on("click",()=>scheda(p));
      MARCATORI.push(m);
    });
    if(elenco.length){
      try{ MAPPA.fitBounds(L.featureGroup(MARCATORI).getBounds().pad(0.2),{maxZoom:16}); }catch(e){}
    }
    conta.textContent=pl(elenco.length,"pl_locali")+" · "+scriviDist(RAGGIO);

    lista.innerHTML = elenco.length
      ? elenco.map((p,i)=>{
          const ap=apertoOra(p.orari), C=CAT[p.cat];
          return `<button class="locale" data-i="${i}" style="--c:${C.c}">
            <span class="num">${catIco(p.cat,17)}<b>${i+1}</b></span>
            <span class="mid"><span class="n">${esc(p.nome)}</span>
              <span class="s"><em>${t(C.k)}</em>${p.via?" · "+esc(p.via):""}</span>
              ${p.pregi.length?`<span class="tag">${p.pregi.slice(0,3).map(x=>`<i>${x.testo}</i>`).join("")}</span>`:""}
            </span>
            <span class="dx"><span class="km">${scriviDist(p.d)}</span>
              ${ap===null?"":`<span class="ap ${ap?"si":"no"}">${ap?t("aperto"):t("chiuso")}</span>`}
            </span></button>`;}).join("")
      : `<div class="vuoto">${FILTRI.size?t("mappa_nessunfiltro"):t("mappa_nessuno",{n:(RAGGIO/1000).toFixed(1).replace(".",",")})}
         ${FILTRI.size?"":`<br><br><button class="cta bianca" id="mampia" style="width:auto;padding:0 24px;
           height:46px;display:inline-flex">${t("mappa_ampia")}</button>`}</div>`;
    /* in fondo, il comando per cercare piu lontano */
    const su=RAGGI.find(r=>r>RAGGIO);
    if(su) lista.insertAdjacentHTML("beforeend",
      `<button class="allarga" id="mallarga">${t("allarga",{n:scriviDist(su)})}</button>`);

    lista.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
      const p=elenco[+b.dataset.i];
      MAPPA.flyTo([p.lat,p.lon],17,{duration:.7});
      tocco("lieve"); scheda(p);
    });
    const al=$("mallarga");
    if(al) al.onclick=()=>{ RAGGIO=su; tocco("lieve"); avvia(); };
    const amp=$("mampia");
    if(amp) amp.onclick=()=>{ RAGGIO=su||RAGGIO; DOVE&&avvia(); };
  }

  /* ---------- che ore fa oggi: estrae la fascia del giorno corrente ---------- */
  const GIORNI=["Su","Mo","Tu","We","Th","Fr","Sa"];
  function orariOggi(orari){
    if(!orari) return null;
    if(/24\/7/.test(orari)) return "24/7";
    const g=GIORNI[new Date().getDay()];
    for(const pezzo of orari.split(";")){
      const m=pezzo.trim().match(/^([A-Za-z,\-]+)?\s*([0-9:,\-\s]+)$/);
      if(!m) continue;
      const gg=m[1]||"Mo-Su";
      let vale=gg.indexOf(g)>=0;
      if(!vale && gg.includes("-")){            /* intervalli tipo Mo-Fr */
        const [a,b]=gg.split("-").map(x=>GIORNI.indexOf(x.trim().slice(0,2)));
        const oggi=new Date().getDay();
        if(a>=0&&b>=0) vale = a<=b ? (oggi>=a&&oggi<=b) : (oggi>=a||oggi<=b);
      }
      if(vale) return m[2].trim();
    }
    return null;
  }
  /* a che ora apre, se adesso è chiuso */
  function apreAlle(orari){
    const oggi=orariOggi(orari);
    if(!oggi||oggi==="24/7") return null;
    const ora=new Date().getHours()*60+new Date().getMinutes();
    for(const f of oggi.split(",")){
      const o=f.trim().match(/(\d{1,2}):(\d{2})/);
      if(!o) continue;
      if(+o[1]*60 + +o[2] > ora) return o[1].padStart(2,"0")+":"+o[2];
    }
    return null;
  }
  const aPiedi=m=>Math.max(1,Math.round(m/80));   /* ~4,8 km orari */

  /* ---------- una descrizione vera, presa da Wikipedia quando esiste ---------- */
  const CACHE_WIKI={};
  async function daWikipedia(g){
    if(!g) return null;
    let lingua=null, titolo=null;
    if(g.wikipedia && g.wikipedia.includes(":")){
      [lingua,titolo]=g.wikipedia.split(/:(.+)/);
    } else if(g.wikidata){
      try{
        const r=await fetch(`https://www.wikidata.org/w/api.php?action=wbgetentities`+
          `&ids=${g.wikidata}&props=sitelinks|descriptions&format=json&origin=*`);
        const d=await r.json();
        const e=d.entities&&d.entities[g.wikidata];
        if(!e) return null;
        const sl=e.sitelinks||{};
        for(const L of [LG,"it","en"]){
          if(sl[L+"wiki"]){ lingua=L; titolo=sl[L+"wiki"].title; break; }
        }
        if(!titolo){
          const d2=(e.descriptions||{})[LG]||(e.descriptions||{}).it||(e.descriptions||{}).en;
          return d2? {testo:d2.value, fonte:"Wikidata", url:"https://www.wikidata.org/wiki/"+g.wikidata} : null;
        }
      }catch(e){ return null; }
    }
    if(!lingua||!titolo) return null;
    const chiave=lingua+":"+titolo;
    if(CACHE_WIKI[chiave]!==undefined) return CACHE_WIKI[chiave];
    try{
      const r=await fetch(`https://${lingua}.wikipedia.org/api/rest_v1/page/summary/`+
        encodeURIComponent(titolo));
      if(!r.ok) throw 0;
      const d=await r.json();
      const out=d.extract? {testo:d.extract, fonte:"Wikipedia",
        url:(d.content_urls&&d.content_urls.mobile&&d.content_urls.mobile.page)||""} : null;
      CACHE_WIKI[chiave]=out; return out;
    }catch(e){ CACHE_WIKI[chiave]=null; return null; }
  }

  function scheda(p){
    const ap=apertoOra(p.orari), C=CAT[p.cat], g=p.tag||{};
    const oggi=orariOggi(p.orari), apre=ap===false?apreAlle(p.orari):null;
    const righe=[];
    if(p.via) righe.push(["pin",t("indirizzo"),esc(p.via)]);
    if(oggi) righe.push(["ora",t("oggi"),esc(oggi==="24/7"?t("sempre_aperto"):oggi)]);
    if(p.orari && p.orari.includes(";") && !/24\/7/.test(p.orari))
      righe.push(["cal",t("orari"),esc(p.orari)]);
    if(g.cuisine) righe.push(["posate",t("cucina"),esc(g.cuisine.replace(/[_;]/g," "))]);
    if(g.brand||g.operator) righe.push(["tizio",t("gestore"),esc(g.brand||g.operator)]);
    if(g.capacity) righe.push(["gente",t("posti"),esc(g.capacity)]);
    if(g["addr:city"] && !(p.via||"").includes(g["addr:city"]))
      righe.push(["casa",t("citta"),esc(g["addr:city"])]);

    const ig=g["contact:instagram"]||g.instagram||"";
    const link=u=>/^https?:/.test(u)?u:"https://instagram.com/"+String(u).replace(/^@/,"");
    const az=(id,ico,testo)=>`<button class="azione" id="${id}">${sic(ico,21)}<span>${testo}</span></button>`;
    const frecc=`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>`;

    foglio(`
      <div class="scheda-capo" style="--c:${C.c}">
        <span class="ico">${catIco(p.cat,27)}</span>
        <span class="tt"><h3>${esc(p.nome)}</h3>
          <span class="s">${t(C.k)} · ${scriviDist(p.d)} · ${t("a_piedi",{n:aPiedi(p.d)})}</span>
          ${ap===null?"":`<span class="stato ${ap?"ap":"ch"}">${ap?t("aperto"):t("chiuso")}${
            apre?` · ${t("apre",{h:apre})}`:""}</span>`}</span>
      </div>

      <div id="wsegna"></div>
      ${p.testo?`<div class="riquadro sr-box"><p class="sr">${esc(p.testo)}</p></div>`:""}

      ${p.pregi.length?`<div class="pregi">${p.pregi.map(x=>
        `<span>${sic(x.ico,16)}${x.testo}</span>`).join("")}</div>`:""}

      ${righe.length?`<div class="dosi righe-info">${righe.map(([ic,k,v])=>
        `<div class="dose"><span class="n">${sic(ic)}${k}</span>
         <span class="q">${v}</span></div>`).join("")}</div>`:""}

      <div class="azioni">
        ${p.tel?az("mtel","ora",t("chiama")).replace(SIC.ora,
          '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.4 2.1L8 9.6a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.4c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z"/>'):""}
        ${p.sito?`<button class="azione" id="msito"><svg width="21" height="21" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/>
          <path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></svg>
          <span>${t("sito")}</span></button>`:""}
        ${ig?`<button class="azione" id="mig"><svg width="21" height="21" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="3"
          width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
          <span>Instagram</span></button>`:""}
        <button class="azione" id="mweb"><svg width="21" height="21" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-3.5-3.5"/></svg><span>${t("cerca_web")}</span></button>
      </div>

      <button class="cta grande" id="mvai"><span class="tondello">${frecc}</span>
        ${t("mappa_apri")}</button>

/* =====================================================================
   DIARIO DI DEGUSTAZIONE
   Prende il posto degli appunti e li assorbe.
   Le foto stanno in IndexedDB: e nel telefono, non serve nessun servizio
   esterno, e regge molto piu dei 5 MB scarsi di localStorage.
   ===================================================================== */

/* ---------- archivio delle immagini ---------- */
const FOTOTECA=(()=>{
  let db=null;
  const apri=()=>new Promise((ok,ko)=>{
    if(db) return ok(db);
    if(!window.indexedDB) return ko(new Error("niente indexedDB"));
    const r=indexedDB.open("stir-foto",1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains("f"))
      r.result.createObjectStore("f"); };
    r.onsuccess=()=>{db=r.result;ok(db);};
    r.onerror=()=>ko(r.error);
  });
  const op=(modo,fn)=>apri().then(d=>new Promise((ok,ko)=>{
    const tr=d.transaction("f",modo), st=tr.objectStore("f");
    const q=fn(st);
    q.onsuccess=()=>ok(q.result); q.onerror=()=>ko(q.error);
  }));
  return {
    metti:(k,blob)=>op("readwrite",st=>st.put(blob,k)),
    prendi:k=>op("readonly",st=>st.get(k)),
    togli:k=>op("readwrite",st=>st.delete(k))
  };
})();

/* riduce l'immagine prima di salvarla: 1100px al lato lungo, JPEG.
   Una foto da 4 MB scende a circa 200 KB senza perdere qualita utile. */
function riduciFoto(file){
  return new Promise((ok,ko)=>{
    const lettore=new FileReader();
    lettore.onerror=()=>ko(new Error("lettura"));
    lettore.onload=()=>{
      const img=new Image();
      img.onerror=()=>ko(new Error("immagine"));
      img.onload=()=>{
        const M=1100;
        let {width:w,height:h}=img;
        if(Math.max(w,h)>M){ const s=M/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        cv.toBlob(b=>b?ok(b):ko(new Error("conversione")),"image/jpeg",.78);
      };
      img.src=lettore.result;
    };
    lettore.readAsDataURL(file);
  });
}

D.voce=({id})=>{
  const leggi=()=>{
    ["nm","tipo","orig","quando","ing","proc","note"].forEach(k=>{
      const e=$("c-"+k); if(e) BOZZA[k]=e.value;
    });
  };

    app.querySelectorAll("[data-forza]").forEach(x=>
      x.setAttribute("aria-pressed", x===b));
  });
  app.querySelectorAll("[data-cuore]").forEach(b=>b.onclick=()=>{
    const n=+b.dataset.cuore;
    BOZZA.cuori = BOZZA.cuori===n ? 0 : n;
    tocco("lieve");
    app.querySelectorAll("[data-cuore]").forEach(x=>
      x.setAttribute("aria-pressed", +x.dataset.cuore<=BOZZA.cuori));
    $("conta").textContent=BOZZA.cuori+"/10";
  });

  /* --- la foto --- */
  const riq=$("riqfoto"), img=$("anteprima"), vuota=$("fotovuota"), tolgo=$("togliefoto");
  const mostra=blob=>{
    if(FOTO_URL) URL.revokeObjectURL(FOTO_URL);
    FOTO_URL=URL.createObjectURL(blob);
    img.src=FOTO_URL; riq.classList.add("piena");
  };
  if(BOZZA.foto) FOTOTECA.prendi(BOZZA.foto).then(b=>{ if(b) mostra(b); }).catch(()=>{});
  vuota.onclick=()=>$("filefoto").click();
  img.onclick=()=>$("filefoto").click();
  $("filefoto").onchange=async e=>{
    const f=e.target.files&&e.target.files[0];
    if(!f) return;
    vuota.querySelector("span").textContent=t("carico_foto");
    try{
      const piccola=await riduciFoto(f);
      const chiave=BOZZA.foto||("f"+BOZZA.id);
      await FOTOTECA.metti(chiave,piccola);
      BOZZA.foto=chiave; mostra(piccola);
    }catch(err){
      vuota.querySelector("span").textContent=t("foto_errore");
    }
  };
  tolgo.onclick=async ev=>{
    ev.stopPropagation();
    if(BOZZA.foto){ try{ await FOTOTECA.togli(BOZZA.foto); }catch(e){} }
    BOZZA.foto=null; img.removeAttribute("src"); riq.classList.remove("piena");
    vuota.querySelector("span").textContent=t("aggiungi_foto");
  };

  app.querySelector("[data-salva]").onclick=()=>{
    leggi();
    if(!BOZZA.nm.trim() && !BOZZA.note.trim()){ avviso(t("serve_nome")); return; }
    const i=DIARIO.findIndex(x=>x.id===BOZZA.id);
    if(i>=0) DIARIO[i]={...BOZZA}; else DIARIO.push({...BOZZA});
    sDIARIO(); tocco(); back();
  };
  const el=app.querySelector("[data-elimina]");
  if(el) el.onclick=()=>{
    foglio(`<h3 style="font-size:20px;margin-bottom:10px">${t("elimina_voce")}</h3>
      <p style="color:var(--ink2);font-size:14.5px;line-height:1.5">${t("sicuro_elimina")}</p>
      <div style="height:16px"></div>
      <button class="cta" id="siElimina">${t("elimina")}</button>
      <div style="height:8px"></div>
      <button class="cta bianca" data-chiudi>${t("annulla")}</button>`);
    $("siElimina").onclick=async()=>{
      if(BOZZA.foto){ try{ await FOTOTECA.togli(BOZZA.foto); }catch(e){} }
      DIARIO=DIARIO.filter(x=>x.id!==BOZZA.id); sDIARIO();
      chiudiF(); back();
    };
  };
};

/* onda liquida: per i tre grandi passaggi dalla home */
function conOnda(azione){
  if(inTransito) return;
  const o=document.getElementById("onda");
  if(!o){azione();return;}
  inTransito=true;
  o.classList.remove("va"); void o.offsetWidth; o.classList.add("va");
  setTimeout(()=>{ try{saltaFade=true;azione();}catch(e){saltaFade=false;} },560);
  setTimeout(()=>{o.classList.remove("va");inTransito=false;},1180);
  /* rete di sicurezza: qualunque cosa accada, si sblocca */
  setTimeout(()=>{inTransito=false;},2600);
}

/* dissolvenza esplicita, quando serve fuori dalla navigazione normale */
function conFade(azione){ navigando(azione); }

/* rotolo: i testi salgono, quelli nuovi entrano da sotto */
function conRotolo(azione){
  if(inTransito) return;
  const t=app.querySelector(".prep .testo"), l=app.querySelector(".prep .plista");
  if(!t){azione();return;}
  inTransito=true;
  t.classList.add("rotola-su");
  if(l) l.classList.add("rotola-su");
  setTimeout(()=>{
    try{
      azione();
      const v=app.querySelector(".vista"); if(v) v.classList.add("ferma");
      const t2=app.querySelector(".prep .testo"), l2=app.querySelector(".prep .plista");
      if(t2) t2.classList.add("rotola-giu");
      if(l2) l2.classList.add("rotola-giu","dopo");
    } finally { inTransito=false; }
  },195);
}

    const extra=dz.scrollHeight-dz.clientHeight;

    if(trabocca){

      sc.style.height=h+"%";
      sc.style.top=(dz.scrollTop/dz.scrollHeight*100)+"%";
    }
  };
  dz.onscroll=()=>{
    const extra=dz.scrollHeight-dz.clientHeight;
    if(extra>4){
      sc.style.top=(dz.scrollTop/dz.scrollHeight*100)+"%";
      box.classList.toggle("trabocca",dz.scrollTop<extra-4);
    }
  };
  bt.onclick=()=>{
    aperto=!aperto;
    telo.classList.toggle("espansa",aperto);
    dz.scrollTop=0;
    if(aperto){ box.classList.remove("trabocca"); bt.classList.add("si"); }
    requestAnimationFrame(()=>{ if(!aperto) misura(); else {
      tt.textContent=t("riduci");
      /* se pure a schermo pieno non ci stanno, stringo le righe */
      const troppo=dz.scrollHeight-dz.clientHeight;
      dz.querySelectorAll(".dose").forEach(d=>{
        d.style.padding = troppo>4 ? "6px 0" : "";});
    }});};
  requestAnimationFrame(()=>requestAnimationFrame(misura));
  window.addEventListener("resize",misura,{once:true});
};

/* =====================================================================
   PDF DELLA RICETTA
   ===================================================================== */
function cp1252(t){
  const m={"\u2018":0x91,"\u2019":0x92,"\u201C":0x93,"\u201D":0x94,"\u2013":0x96,
    "\u2014":0x97,"\u2026":0x85,"\u2022":0x95,"\u20AC":0x80,"\u00A0":0x20};
  let o="";
  for(const ch of t){const k=ch.codePointAt(0);
    o+= m[ch]!==undefined?String.fromCharCode(m[ch]) : (k<256?ch:"?");}
  return o;
}
const pesc=t=>cp1252(String(t)).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
function spezza(t,max){
  const w=String(t).split(/\s+/), out=[]; let r="";
  w.forEach(x=>{ if((r+" "+x).trim().length>max){out.push(r.trim());r=x;} else r+=" "+x; });
  if(r.trim()) out.push(r.trim());
  return out;
}
/* colore esadecimale -> operatore PDF */
function pcol(h){const c=hx(h); return (c[0]/255).toFixed(3)+" "+(c[1]/255).toFixed(3)+" "+(c[2]/255).toFixed(3);}

function pdfRicetta(c){
  const W=595,H=842,M=44,K=.5523,L=[],SH=[];
  const P=palette(c), LIQ=liquido(c);
  const ACC = luce(P[0])>.58 ? scurisce(P[0],.42) : P[0];
  const ARA = "#EF5F3C";
  const larg=(t,size,gr)=>cp1252(String(t)).length*size*(gr?0.56:0.50);
  const T=(t,x,y,size,gr,col)=>L.push(`BT /${gr?"F1":"F2"} ${size} Tf ${col||"0.09 0.09 0.11"} rg `+
    `${(+x).toFixed(1)} ${(+y).toFixed(1)} Td (${pesc(t)}) Tj ET`);
  const TR=(t,x,y,size,gr,col)=>T(t,x-larg(t,size,gr),y,size,gr,col);
  const TC=(t,x,y,size,gr,col)=>T(t,x-larg(t,size,gr)/2,y,size,gr,col);
  const box=(x,y,w,h,col)=>L.push(`${col} rg ${x} ${y} ${w} ${h} re f`);
  const riga=(x1,y1,x2,y2,col,sp)=>L.push(`${col} RG ${sp||0.8} w ${x1} ${y1} m ${x2} ${y2} l S`);
  const cerchio=(cx,cy,r,col,pieno,sp)=>{const k=r*K;
    L.push(`${col} ${pieno?"rg":"RG"} ${pieno?"":(sp||2)+" w "}${cx-r} ${cy} m `+
      `${cx-r} ${cy+k} ${cx-k} ${cy+r} ${cx} ${cy+r} c ${cx+k} ${cy+r} ${cx+r} ${cy+k} ${cx+r} ${cy} c `+
      `${cx+r} ${cy-k} ${cx+k} ${cy-r} ${cx} ${cy-r} c ${cx-k} ${cy-r} ${cx-r} ${cy-k} ${cx-r} ${cy} c ${pieno?"f":"S"}`);};
  /* percorso rettangolo arrotondato, angoli scelti */
  const perc=(x,y,w,h,r,ang)=>{const k=r*K, a=ang||[1,1,1,1];
    const rb=a[0]?r:0, rd=a[1]?r:0, rt=a[2]?r:0, rs=a[3]?r:0;
    return `${x+rb} ${y} m ${x+w-rd} ${y} l `+
      (rd?`${x+w-rd+k} ${y} ${x+w} ${y+rd-k} ${x+w} ${y+rd} c `:`${x+w} ${y} l `)+
      `${x+w} ${y+h-rt} l `+
      (rt?`${x+w} ${y+h-rt+k} ${x+w-rt+k} ${y+h} ${x+w-rt} ${y+h} c `:`${x+w} ${y+h} l `)+
      `${x+rs} ${y+h} l `+
      (rs?`${x+rs-k} ${y+h} ${x} ${y+h-rs+k} ${x} ${y+h-rs} c `:`${x} ${y+h} l `)+
      `${x} ${y+rb} l `+
      (rb?`${x} ${y+rb-k} ${x+rb-k} ${y} ${x+rb} ${y} c `:``);};
  const scheda=(x,y,w,h,r,col,ang)=>L.push(`${col||"1 1 1"} rg ${perc(x,y,w,h,r,ang)} f`);
  /* sfumatura vera dentro una forma */
  const sfuma=(percorso,c0,c1,x0,y0,x1,y1)=>{
    const id=SH.length; SH.push({c0:hx(c0).map(v=>(v/255).toFixed(3)).join(" "),
      c1:hx(c1).map(v=>(v/255).toFixed(3)).join(" "),co:[x0,y0,x1,y1].join(" ")});
    L.push(`q ${percorso} W n /Sh${id} sh Q`);};

  /* ---------- il bicchiere ---------- */
  function bicchiere(cx,base,alt,bianco){
    const liq=pcol(LIQ), v=bianco||"0.99 0.99 1";
    const f=(PERBICCH[c.bicc]||"tumbler");
    if(f==="coppetta"){
      const r=alt*0.42, cy=base+alt*0.60, prof=alt*0.32;
      L.push(`${liq} rg ${cx-r*0.90} ${cy} m ${cx-r*0.82} ${cy-prof*0.90} ${cx+r*0.82} ${cy-prof*0.90} ${cx+r*0.90} ${cy} c f`);
      L.push(`${v} RG 3 w ${cx-r} ${cy} m ${cx-r*0.9} ${cy-prof} ${cx+r*0.9} ${cy-prof} ${cx+r} ${cy} c S`);
      riga(cx-r-3,cy,cx+r+3,cy,v,3.2);
      riga(cx,cy-prof,cx,base+alt*0.05,v,3);
      riga(cx-r*0.55,base+alt*0.04,cx+r*0.55,base+alt*0.04,v,3.4);
    } else if(f==="flute"){
      const r=alt*0.16, cy=base+alt*0.98, giu=base+alt*0.42;
      L.push(`${liq} rg ${cx-r*0.78} ${giu+5} ${r*1.56} ${(cy-7)-(giu+5)} re f`);
      L.push(`${v} RG 3 w ${cx-r} ${cy} m ${cx-r*0.84} ${giu} ${cx+r*0.84} ${giu} ${cx+r} ${cy} c S`);
      riga(cx-r-3,cy,cx+r+3,cy,v,3.2);
      riga(cx,giu,cx,base+alt*0.05,v,3);
      riga(cx-r*1.8,base+alt*0.04,cx+r*1.8,base+alt*0.04,v,3.4);
    } else if(f==="balloon"||f==="hurricane"){
      const r=alt*0.36, cy=base+alt*0.56, prof=alt*0.42;
      L.push(`${liq} rg ${cx-r*0.86} ${cy-prof*0.16} m ${cx-r*0.95} ${cy-prof*0.94} ${cx+r*0.95} ${cy-prof*0.94} ${cx+r*0.86} ${cy-prof*0.16} c f`);
      L.push(`${v} RG 3 w ${cx-r} ${cy+4} m ${cx-r*1.06} ${cy-prof} ${cx+r*1.06} ${cy-prof} ${cx+r} ${cy+4} c S`);
      riga(cx-r-3,cy+4,cx+r+3,cy+4,v,3.2);
      riga(cx,cy-prof,cx,base+alt*0.05,v,3);
      riga(cx-r*0.6,base+alt*0.04,cx+r*0.6,base+alt*0.04,v,3.4);
    } else {
      const rb=alt*0.30, rt=alt*0.40, alto=base+alt*0.86, fondo=base+alt*0.05;
      const liv=fondo+(alto-fondo)*0.62, kx=y2=>rb+(rt-rb)*((y2-fondo)/(alto-fondo));
      L.push(`${liq} rg ${cx-rb*0.93} ${fondo+2} m ${cx+rb*0.93} ${fondo+2} l `+
        `${cx+kx(liv)*0.93} ${liv} l ${cx-kx(liv)*0.93} ${liv} l f`);
      if(/cubetti|cubo/i.test(c.gh)){
        L.push(`1 1 1 rg ${perc(cx-24,liv-26,19,19,7)} f`);
        L.push(`1 1 1 rg ${perc(cx+3,liv-40,15,15,6)} f`);}
      L.push(`${v} RG 3 w ${cx-rt} ${alto} m ${cx-rb} ${fondo} l ${cx+rb} ${fondo} l ${cx+rt} ${alto} l S`);
      riga(cx-rt-3,alto,cx+rt+3,alto,v,3.2);
    }
  }

  /* ================= SFONDO ================= */
  box(0,0,W,H,pcol("#F4F4F7"));

  /* ================= TESTATA COLORATA ================= */
  const HE=282, hy=H-HE;
  sfuma(perc(0,hy,W,HE,34,[1,1,0,0]), schiara(LIQ,.12), scurisce(LIQ,.62), 0,H, W*0.95,hy);
  /* marchio */
  const bx=M+3, by=H-70;
  L.push(`1 1 1 RG 5 w ${bx-5} ${by-11} m ${bx+34} ${by-11} l S`);
  L.push(`1 1 1 RG 5 w ${bx} ${by-5} m ${bx} ${by+30} l ${bx} ${by+30} l ${bx+12} ${by+30} l `+
    `${bx+21} ${by+30} ${bx+21} ${by+16} ${bx+12} ${by+16} c ${bx} ${by+16} l ${bx+15} ${by+16} l `+
    `${bx+25} ${by+16} ${bx+25} ${by-5} ${bx+15} ${by-5} c ${bx} ${by-5} l S`);
  T("STIR",M+50,H-56,17,1,"1 1 1");
  T("IMPARA. CREA. SERVI.",M+50,H-70,6.5,0,"1 1 1");
  /* pillola ricetta */
  const pw=larg(t("ricetta_pdf"),8,1)+26;
  L.push(`1 1 1 rg ${perc(W-M-pw,H-64,pw,22,11)} f`);
  TC(t("ricetta_pdf"),W-M-pw/2,H-57,8,1,pcol(scurisce(LIQ,.55)));
  /* bicchiere */
  const gx=W-M-96, gb=hy+54;
  bicchiere(gx,gb,172);
  /* nome */
  const nl=spezza(c.nm,15);
  let ty=hy+108+(nl.length-1)*30;
  const dim=c.nm.length>16?27:33;
  nl.forEach(r=>{T(r,M,ty,dim,1,"1 1 1"); ty-=dim+2;});
  T(`${c.p}${c.an?"   ·   "+c.an:""}`,M,ty+4,11,0,"1 1 1");
  /* tecnica come pillola */
  const tw=larg(v(c.tec),8.5,1)+22;
  L.push(`1 1 1 RG 1 w ${perc(M,hy+26,tw,20,10)} S`);
  TC(v(c.tec),M+tw/2,hy+32,8.5,1,"1 1 1");

  /* ================= PROPORZIONI ================= */
  let y=hy-40;
  T(t("proporzioni_pdf"),M,y+14,8,1,"0.58 0.58 0.64");
  const tot=c.ing.reduce((a,x)=>a+(x.u==="ml"?+x.q:6),0)||1;
  let px=M, lw=W-M*2;
  c.ing.forEach((x,i)=>{const q=((x.u==="ml"?+x.q:6)/tot)*lw;
    const ang=[i===0?1:0,i===c.ing.length-1?1:0,i===c.ing.length-1?1:0,i===0?1:0];
    L.push(`${pcol(tinta(x.i))} rg ${perc(px,y,Math.max(q-2,2),9,4.5,ang)} f`); px+=q;});

  /* ================= INGREDIENTI ================= */
  y-=22;
  const hIng=44+c.ing.length*27;
  scheda(M,y-hIng+18,W-M*2,hIng,18);
  T(t("ingredienti").toUpperCase(),M+20,y-4,9,1,"0.56 0.56 0.62");
  TR(t("per_n",{n:bicchieri(ST.porz)}),W-M-20,y-4,9,0,"0.62 0.62 0.68");
  y-=28;
  c.ing.forEach((x,i)=>{
    cerchio(M+27,y+4,5,pcol(tinta(x.i)),true);
    T(v(x.i),M+42,y,12.5,0);
    const q=nrm(x.q*ST.porz), u=" "+unita(x.u);
    TR(u,W-M-20,y,9,0,"0.6 0.6 0.66");
    TR(q,W-M-20-larg(u,9,0)-2,y,13,1,pcol(scurisce(ACC,.15)));
    if(i<c.ing.length-1) riga(M+42,y-9,W-M-20,y-9,"0.93 0.93 0.95",0.7);
    y-=27;
  });
  y-=16;

  /* ================= SERVIZIO ================= */
  scheda(M,y-60,W-M*2,80,18);
  const cw=(W-M*2)/3;
  [[t("bicchiere"),v(c.bicc)],[t("ghiaccio"),v(c.gh)],[t("finitura"),v(c.gar)]].forEach(([k,val],i)=>{
    const cx=M+cw*i+cw/2;
    TC(k.toUpperCase(),cx,y-2,7.5,1,"0.56 0.56 0.62");
    /* invece di troncare, si va a capo su due righe */
    const righe=val.length>17?spezza(val,16).slice(0,2):[val];
    righe.forEach((r,ri)=>TC(r,cx,y-24-ri*13,11,0));
    if(i) riga(M+cw*i,y-52,M+cw*i,y+10,"0.9 0.9 0.93",0.8);
  });
  y-=80;

  /* ================= VOLUME / GRADAZIONE ================= */
  const hw=(W-M*2-12)/2;
  sfuma(perc(M,y-46,hw,62,18), schiara(ACC,.80), schiara(ACC,.94), M,y+16, M+hw,y-46);
  scheda(M+hw+12,y-46,hw,62,18);
  T(t("volume").toUpperCase(),M+20,y-2,7.5,1,"0.5 0.5 0.56");
  T(`${nrm(vol(c)*ST.porz)} ml`,M+20,y-28,17,1);
  T(t("gradazione").toUpperCase(),M+hw+32,y-2,7.5,1,"0.56 0.56 0.62");
  T(c.abv?`${c.abv}% vol`:"—",M+hw+32,y-28,17,1);
  y-=68;

  /* ================= DA SAPERE ================= */
  const disponibile=(y+18)-92;
  if(c.st && disponibile>50){
    const max=Math.max(1,Math.floor((disponibile-34)/15));
    let rgs=spezza(c.st,66);
    if(rgs.length>max){rgs=rgs.slice(0,max); rgs[max-1]=rgs[max-1].replace(/[.,;:]?$/,"…");}
    const hS=34+rgs.length*15;
    scheda(M,y-hS+18,W-M*2,hS,18);
    L.push(`${pcol(ARA)} rg ${perc(M,y-hS+18,5,hS,2.5,[1,0,0,1])} f`);
    T(t("da_sapere").toUpperCase()+(LG==="it"?"":"  ·  "+t("storia_it")),M+20,y-4,9,1,"0.56 0.56 0.62");
    y-=24;
    rgs.forEach(r=>{T(r,M+20,y,11,0,"0.3 0.3 0.35"); y-=15;});
  }

  /* ================= PIEDE ================= */
  scheda(M,26,W-M*2,58,18);
  const lx=M+42, ly=55, lr=15;
  L.push(`q ${pcol("#2B4868")} rg ${lx-lr} ${ly} m ${lx-lr} ${ly+lr*K} ${lx-lr*K} ${ly+lr} ${lx} ${ly+lr} c `+
    `${lx+lr*K} ${ly+lr} ${lx+lr} ${ly+lr*K} ${lx+lr} ${ly} c ${lx+lr} ${ly-lr*K} ${lx+lr*K} ${ly-lr} ${lx} ${ly-lr} c `+
    `${lx-lr*K} ${ly-lr} ${lx-lr} ${ly-lr*K} ${lx-lr} ${ly} c f Q`);
  L.push(`q ${lx-lr} ${ly} m ${lx-lr} ${ly+lr*K} ${lx-lr*K} ${ly+lr} ${lx} ${ly+lr} c `+
    `${lx+lr*K} ${ly+lr} ${lx+lr} ${ly+lr*K} ${lx+lr} ${ly} c ${lx+lr} ${ly-lr*K} ${lx+lr*K} ${ly-lr} ${lx} ${ly-lr} c `+
    `${lx-lr*K} ${ly-lr} ${lx-lr} ${ly-lr*K} ${lx-lr} ${ly} c W n ${pcol("#FFAD01")} rg `+
    `${lx-lr-2} ${ly-lr-2} m ${lx+lr+2} ${ly+lr+2} l ${lx+lr+2} ${ly-lr-2} l f Q`);
  T("Un'applicazione di Davide Morabito",M+66,ly+3,9.5,1,"0.16 0.16 0.2");
  T("www.davidemorabito.it",M+66,ly-11,9,0,"0.17 0.28 0.41");
  const gw=larg("STIR",8,1)+22;
  L.push(`${pcol(ARA)} rg ${perc(W-M-20-gw,ly-9,gw,20,10)} f`);
  TC("STIR",W-M-20-gw/2,ly-3,8,1,"1 1 1");

  /* ================= ASSEMBLAGGIO ================= */
  const flusso=L.join("\n");
  const shDict=SH.map((v,i)=>`/Sh${i} <</ShadingType 2/ColorSpace /DeviceRGB`+
    `/Coords [${v.co}]/Extend [true true]`+
    `/Function <</FunctionType 2/Domain [0 1]/C0 [${v.c0}]/C1 [${v.c1}]/N 1>> >>`).join(" ");
  const obj=[
    "<</Type/Catalog/Pages 2 0 R>>",
    "<</Type/Pages/Kids[3 0 R]/Count 1>>",
    `<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</Font<</F1 5 0 R/F2 6 0 R>>`+
      `/Shading <<${shDict}>> >>/Contents 4 0 R>>`,
    `<</Length ${flusso.length}>>\nstream\n${flusso}\nendstream`,
    "<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>",
    "<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>"];
  let out="%PDF-1.4\n"; const off=[];
  obj.forEach((o,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`;});
  const xr=out.length;
  out+=`xref\n0 ${obj.length+1}\n0000000000 65535 f \n`;
  off.forEach(o=>out+=String(o).padStart(10,"0")+" 00000 n \n");
  out+=`trailer\n<</Size ${obj.length+1}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`;
  return out;
}
async function condividi(c){
  try{
    const arr=Uint8Array.from(pdfRicetta(c),ch=>ch.charCodeAt(0)&0xff);
    const nome=`${c.nm.replace(/[^\p{L}\p{N} ]/gu,"")} - STIR.pdf`;
    const inviato=await condividiFile(arr,nome,`${c.nm}, ricetta da STIR`);
    if(!inviato) avviso(t("pdf_ok"));
  }catch(e){ avviso(t("cond_ko")); }
}

function consiglio(c,i){
  const x=c.ing[i], n=c.ing.length;
  if(/soda|tonica|prosecco|champagne|cola|ginger|acqua tonica|cava/i.test(x.i))
    return t("versa1");
  if(/menta/i.test(x.i)) return t("versa2");
  if(/albume/i.test(x.i)) return t("versa3");
  if(x.u==="dash") return t("versa4");
  if(/zolletta|zucchero/i.test(x.i)) return t("versa5");
  if(/panna/i.test(x.i)) return t("versa6");
  if(i===0) return t("versa7",{b:v(c.bicc).toLowerCase()});
  if(i===n-1) return t("versa8",{t:v(c.tec).toLowerCase()});
  return t("versa9");
}
const livello=(c,p)=>{
  const tot=c.ing.reduce((s,x)=>s+(x.u==="ml"?+x.q:6),0)||1;
  return c.ing.slice(0,Math.max(0,p)).reduce((s,x)=>s+(x.u==="ml"?+x.q:6),0)/tot;
};

/* i cocktail che si ordinano davvero, in ordine di quanto si chiedono in Italia */
const CLASSICI=["Aperol Spritz","Negroni","Mojito","Gin Tonic","Margarita","Moscow Mule",
 "Negroni Sbagliato","Americano","Cuba Libre","Espresso Martini","Daiquiri","Old Fashioned",
 "Hugo","Long Island Iced Tea","Sex on the Beach","Caipirinha","Bellini","Piña Colada",
 "Cosmopolitan","Whiskey Sour","Tequila Sunrise","Manhattan","Martini","Garibaldi",
 "Milano-Torino","Paloma","Bloody Mary","White Russian","Mimosa","Rossini","Mai Tai",
 "Dark 'n' Stormy"];
const perNomi=l=>l.map(n=>CK.find(c=>c.nm===n)).filter(Boolean);
/* facile: solo i sedici più chiesti · media: tutti i classici
   difficile: metà classici e metà elaborati, così i comuni non spariscono mai */
function pescaggio(diff){
  const base=perNomi(CLASSICI);
  if(diff===1) return mix(base.slice(0,16));
  if(diff===2) return mix(base);
  const rari=CK.filter(c=>!CLASSICI.includes(c.nm));
  return mix([...mix(base).slice(0,7),...mix(rari).slice(0,7)]);
}

function partita(pool,diff,tipo){
  const dom=[];
  pool.forEach(c=>{const q=nume(c); if(!q.length)return;
    const sc=diff===1?[mix(q)[0]]:diff===2?mix(q).slice(0,Math.max(1,Math.ceil(q.length/2))):q;
    dom.push({ck:c,campi:mix(sc)});});
  if(!dom.length) return avviso(t("no_dose"));
  T={diff,tipo,dom,iC:0,iX:0,punti:0,serie:0,fatte:0,ok:0,aiuti:0,aiuto:false,
     tot:dom.reduce((s,d)=>s+d.campi.length,0),sb:[],tempo:0};
  bloc=false;err=0;scelta=null;vai("quiz");
}
function sfida(){
  const dom=[];pescaggio(2).forEach(c=>{const q=nume(c);
    if(q.length) dom.push({ck:c,campi:[mix(q)[0]]});});
  T={diff:1,tipo:"sfida",dom,iC:0,iX:0,punti:0,serie:0,fatte:0,ok:0,aiuti:0,aiuto:false,
     tot:dom.length,sb:[],tempo:60};
  bloc=false;err=0;scelta=null;vai("quiz");
}

function opz(campo,n){
  const sc=campo.u==="ml"?SCML:(SCA[campo.u]||[1,2,3,4]);
  const i=sc.indexOf(campo.q); let alt=sc.filter(v=>v!==campo.q);
  if(i>=0) alt.sort((a,b)=>Math.abs(sc.indexOf(a)-i)-Math.abs(sc.indexOf(b)-i));
  const s=[campo.q,...alt.slice(0,n-1)];
  return n>6 ? s.sort((a,b)=>a-b) : mix(s);
}
function rispondi(v,btn,campo){
  const c=T.dom[T.iC].ck;

    bloc=true;btn.classList.add("si");sOk();tocco("medio");

    else if(err===0){T.ok++;T.serie++;} else T.serie=0;
    T.fatte++;$("qp").textContent=T.punti;$("qb").style.width=(T.fatte/T.tot*100)+"%";
    setTimeout(()=>{bloc=false;err=0;prossima();},560);
  } else {
    err++;T.serie=0;btn.classList.add("no");sNo();tocco("forte");
    $("qok").disabled=true; scelta=null;
    setTimeout(()=>btn.classList.add("giu"),320);
    if(err>=(T.diff===3?3:2)){
      bloc=true;
      T.sb.push({ck:c.nm,ing:campo.i,q:nrm(campo.q*ST.porz)+" "+campo.u});

      const g=[...document.querySelectorAll("#qr [data-v]")].find(b=>+b.dataset.v===campo.q);
      if(g){g.classList.remove("giu");g.classList.add("si");}
      setTimeout(()=>{bloc=false;err=0;prossima();},1000);
    }
  }
}
function prossima(){
  const d=T.dom[T.iC];
  if(T.iX<d.campi.length-1){T.iX++;domanda();return;}
  if(T.iC<T.dom.length-1){T.iC++;T.iX=0;domanda();return;}
  finePartita();
}
function finePartita(){
  stop();

  if(T.tipo==="sfida"&&T.punti>ST.record){ST.record=T.punti;rec=true;}

  conOnda(()=>{P.pop();vai("quizfine",d);});
}

/* L'altezza reale della finestra: su iOS le unita CSS mentono quando le barre
   compaiono o spariscono, e resta una fascia vuota in fondo. Qui la misuro. */
/* marchio della versione: serve a capire se stai vedendo il file nuovo */
const VERSIONE="06/09 16:48";

/* la fotografia dell'apertura resta in memoria: fa da sfondo alle schede */

},{capture:true});

/* Rete di sicurezza solo per i browser che non conoscono dvh.
   Dove dvh esiste non si tocca niente: ci pensa il browser da solo, e una
   misura presa qui sarebbe sempre in ritardo di un movimento — era li che
   nasceva la fascia nera in fondo e l'allungamento al trascinamento. */
const CONOSCE_DVH = !!(window.CSS && CSS.supports && CSS.supports("height","100dvh"));
function altezzaVera(){
  if(CONOSCE_DVH) return;
  const h=window.visualViewport?Math.round(window.visualViewport.height):window.innerHeight;
  if(h>200) document.documentElement.style.setProperty("--vh",h+"px");
}
altezzaVera();
window.addEventListener("resize",altezzaVera);
window.addEventListener("orientationchange",()=>setTimeout(altezzaVera,320));
if(window.visualViewport) window.visualViewport.addEventListener("resize",altezzaVera);
document.addEventListener("visibilitychange",()=>{if(!document.hidden) setTimeout(altezzaVera,60);});

const Cap = window.Capacitor || null;
const nativo = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());

/* --- tasto Indietro di Android: deve tornare alla schermata precedente,
       non chiudere l'app. Se siamo alla radice, chiede conferma. --- */
(function(){
  const indietro=()=>{
    if(velo.classList.contains("on")){chiudiF();return true;}
    if(P.length>1){back();return true;}
    return false;
  };
  if(nativo && Cap.Plugins && Cap.Plugins.App){
    Cap.Plugins.App.addListener("backButton",()=>{
      if(!indietro()){
        if(window.__uscita && Date.now()-window.__uscita<2200){Cap.Plugins.App.exitApp();}
        else{window.__uscita=Date.now();avviso(t("esci2"));}
      }
    });
  } else {
    /* nel browser: il gesto indietro non deve far uscire dal sito */
    history.replaceState({b:0},""); 
    let n=0;
    const spingi=()=>{history.pushState({b:++n},"");};
    spingi();
    window.addEventListener("popstate",()=>{ if(indietro()) spingi(); });
  }
})();

/* --- lo schermo non si spegne mentre versi --- */
let veglia=null;
async function tieniAcceso(si){
  try{
    if(nativo && Cap.Plugins && Cap.Plugins.KeepAwake){
      si ? await Cap.Plugins.KeepAwake.keepAwake() : await Cap.Plugins.KeepAwake.allowSleep();
      return;
    }
    if(!("wakeLock" in navigator)) return;
    if(si && !veglia){ veglia=await navigator.wakeLock.request("screen");
      veglia.addEventListener("release",()=>{veglia=null;}); }
    else if(!si && veglia){ await veglia.release(); veglia=null; }
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && P.length && P[P.length-1].n==="prepara") tieniAcceso(true);
});

/* --- vibrazione discreta sui gesti che contano --- */
function tocco(forza){
  try{
    if(nativo && Cap.Plugins && Cap.Plugins.Haptics){
      Cap.Plugins.Haptics.impact({style:forza==="forte"?"HEAVY":forza==="lieve"?"LIGHT":"MEDIUM"});
      return;
    }
    if(navigator.vibrate) navigator.vibrate(forza==="forte"?[14]:forza==="lieve"?[6]:[10]);
  }catch(e){}
}

/* --- condivisione del PDF: nativa quando c'e, altrimenti scaricamento --- */
async function condividiFile(byte,nome,titolo){
  const blob=new Blob([byte],{type:"application/pdf"});
  if(nativo && Cap.Plugins && Cap.Plugins.Filesystem && Cap.Plugins.Share){
    try{
      const b64=await new Promise(r=>{const f=new FileReader();
        f.onload=()=>r(f.result.split(",")[1]); f.readAsDataURL(blob);});
      const w=await Cap.Plugins.Filesystem.writeFile(
        {path:nome,data:b64,directory:"CACHE"});
      await Cap.Plugins.Share.share({title:titolo,url:w.uri});
      return true;
    }catch(e){}
  }
  if(navigator.canShare){
    try{
      const f=new File([blob],nome,{type:"application/pdf"});
      if(navigator.canShare({files:[f]})){
        await navigator.share({files:[f],title:titolo}); return true;}
    }catch(e){}
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=nome;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  return false;
}

   Serviva a far girare l'app senza connessione, ma serviva index.html
   sempre dalla cache: si restava indietro di una versione a ogni modifica.
   Finche lavoriamo sulla grafica resta spento, e qui sotto ripulisco
   anche le copie gia installate, altrimenti continuerebbero a servirti
   la versione vecchia. */
const SW_ACCESO = false;

if("serviceWorker" in navigator){
  if(SW_ACCESO && location.protocol!=="blob:" && !nativo){
    window.addEventListener("load",()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  } else {
    navigator.serviceWorker.getRegistrations()
      .then(r=>r.forEach(x=>x.unregister()))
      .catch(()=>{});
    if(window.caches) caches.keys()
      .then(k=>k.forEach(n=>caches.delete(n)))
      .catch(()=>{});
  }
}


/* =====================================================================
   RIGHELLO — misura la pagina come la disegna davvero il browser.
   Si accende aggiungendo #misura all'indirizzo, oppure con Ctrl+Shift+M.
   Serve a me: senza motore di rendering non posso vedere il risultato,
   ma questi numeri me lo raccontano con precisione.
   ===================================================================== */
(function(){
  const PEZZI=[
    ["finestra",null],
    ["vista",".vista"],
    ["intestazione",".cima"],
    ["contenitore",".fermo, .scorre"],
    ["griglia carte",".carte"],
    ["prima carta",".hcard"],
    ["icona carta",".hcard .ico"],
    ["illustrazione",".hcard .art"],
    ["titolo carta",".hcard h3"],
    ["freccia carta",".hcard .go"],
    ["striscia",".striscia"],
    ["barra in fondo",".tabbar"],
    ["eroe",".eroe"],
    ["telo",".telo"],
    ["elenco ricette",".griglia-drink"],
    ["prima ricetta",".griglia-drink .drink"],
    ["mappa",".mappa-guscio"],
    ["elenco locali",".elenco-locali"]
  ];  function misura(){
    const R=[];
    R.push("SCHERMO "+screen.width+"x"+screen.height+
           "  FINESTRA "+innerWidth+"x"+innerHeight+
           "  densita "+devicePixelRatio);
    R.push("VERSIONE "+VERSIONE);
    R.push("schermata: "+(P.length?P[P.length-1].n:"?")+
           "   lingua: "+LG+"   tema: "+(ST.tema||"nero"));
    R.push("");
    PEZZI.forEach(([nome,sel])=>{
      if(!sel) return;
      const e=document.querySelector(sel);
      if(!e){ R.push(nome.padEnd(20)+" assente"); return; }
      const r=e.getBoundingClientRect(), c=getComputedStyle(e);
      R.push(nome.padEnd(20)+
        " x"+Math.round(r.left)+" y"+Math.round(r.top)+
        "  "+Math.round(r.width)+"x"+Math.round(r.height)+
        "  testo "+parseFloat(c.fontSize).toFixed(0)+
        "  raggio "+parseInt(c.borderTopLeftRadius||0)+
        "  bordi "+[c.paddingTop,c.paddingRight,c.paddingBottom,c.paddingLeft]
          .map(x=>parseInt(x)||0).join("/"));
    });
    return R.join("\n");
  }
  function apri(){
    let v=document.getElementById("righello");
    if(v){ v.remove(); return; }
    const testo=misura();
    v=document.createElement("div");
    v.id="righello";
    v.innerHTML=`<div class="rig-capo"><b>Righello</b>
        <button id="rig-copia">Copia</button><button id="rig-chiudi">Chiudi</button></div>
      <pre>${testo.replace(/[<>&]/g,x=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[x]))}</pre>`;
    document.body.appendChild(v);
    document.getElementById("rig-chiudi").onclick=()=>v.remove();
    document.getElementById("rig-copia").onclick=async()=>{
      try{ await navigator.clipboard.writeText(testo);
        document.getElementById("rig-copia").textContent="Copiato"; }
      catch(e){
        const a=document.createElement("textarea");a.value=testo;document.body.appendChild(a);
        a.select();document.execCommand("copy");a.remove();
        document.getElementById("rig-copia").textContent="Copiato";
      }
    };
  }
  if(location.hash==="#misura") setTimeout(apri,5600);
  addEventListener("hashchange",()=>{ if(location.hash==="#misura") apri(); });
  addEventListener("keydown",e=>{
    if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="m"){ e.preventDefault(); apri(); }
  });
})();
