<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STIR</title>
<meta name="theme-color" content="#0B0A0C">
<meta name="description" content="Archivio di cocktail classici con dosi, preparazione guidata e quiz sulle dosi.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STIR">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="icon" href="icona-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sfondo:#0B0A0C; --bianco:rgba(255,255,255,.055); --ink:#F5F2EC; --ink2:rgba(245,242,236,.74);
  --grigio:rgba(245,242,236,.46); --lieve:rgba(255,255,255,.10); --lieve2:rgba(255,255,255,.055);
  --arancio:#EF5F3C; --arancio-cupo:#D8412A; --oro:#FFAD01;
  --verde:#3FB07C; --verde-chiaro:rgba(63,176,124,.16);
  --viola:#9A82F0; --rosa:rgba(239,95,60,.15);
  --o1:0 2px 8px rgba(0,0,0,.34);
  --o2:0 6px 20px rgba(0,0,0,.40), 0 1px 3px rgba(0,0,0,.3);
  --o3:0 14px 40px rgba(0,0,0,.52), 0 3px 10px rgba(0,0,0,.34);
  /* superficie opaca: nera resa visibile da tratto e sfumatura */
  --carta:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.038));
  --carta-tratto:inset 0 1px 0 rgba(255,255,255,.17),inset 0 0 0 1px rgba(255,255,255,.085);

  /* ---- Liquid Glass ---- */
  --vetro:rgba(255,255,255,.075);
  --vetro-forte:rgba(255,255,255,.115);
  --vetro-scuro:rgba(255,255,255,.16);
  --sfoca:blur(24px) saturate(150%) brightness(1.5);
  --sfoca-lieve:blur(16px) saturate(140%) brightness(1.35);
  --rim:inset 0 1px 1px rgba(255,255,255,.34),
        inset 0 -1px 1px rgba(255,255,255,.09),
        inset 0 0 0 1px rgba(255,255,255,.13);
  --rim-scuro:inset 0 1px 1px rgba(255,255,255,.45),
        inset 0 0 0 1px rgba(255,255,255,.2);
  --bordo:0 0 0 .5px rgba(0,0,0,.6);           /* bordo scurito, iOS 27 */
  --molla:cubic-bezier(.32,.72,0,1);           /* andatura di sistema, per i gesti */
  --dolce:cubic-bezier(.33,0,.22,1);           /* per le dissolvenze: parte piano */
  --r-g:26px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  /* niente selezione del testo ne menu al tocco lungo: e un'app, non una pagina */
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* i campi di scrittura restano selezionabili, altrimenti non si puo correggere */
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;
  -webkit-touch-callout:default}
html{height:100%;-webkit-text-size-adjust:100%;background:#0B0A0C;
  overflow:hidden;overscroll-behavior:none}
body{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;
  /* dvh e l'unita che il browser aggiorna da solo quando compaiono o
     spariscono le barre: qualunque misura presa in JavaScript la
     scavalcherebbe con un valore vecchio, ed e li che nasceva la
     fascia nera in fondo. */
  height:100%;height:100dvh;
  overflow:hidden;overscroll-behavior:none;
  touch-action:pan-y;
  background:var(--sfondo);color:var(--ink);
  font-family:'Plus Jakarta Sans',-apple-system,'SF Pro Text','Segoe UI',Roboto,
    'Helvetica Neue',system-ui,sans-serif;font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;letter-spacing:-.012em}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.032em;line-height:1.05}
.sr{font-weight:700;letter-spacing:-.025em}
.vetro{width:100%;height:100%;display:block;overflow:visible}

/* ---------- stato di partenza: cosi il primo fotogramma non mostra mai la fine ---------- */
.pezzo{transform:translateX(-64%)}
.fronte .fade{opacity:0}
.livello{transform:translateY(76px)}
.cubo1{transform:translateY(-152px) rotate(-34deg);opacity:0}
.cubo2{transform:translateY(-164px) rotate(28deg);opacity:0}
.schizzo{opacity:0}
.go .pezzo,.go .fade,.go .livello,.go .cubo1,.go .cubo2,.go .schizzo{animation-fill-mode:both}

/* ---------- coreografia ---------- */
.go .pezzo{animation:volo 1.7s cubic-bezier(.2,.85,.3,1) both}
@keyframes volo{
  0%   {transform:translateX(-64%);animation-timing-function:cubic-bezier(.42,.12,.3,1)}
  56%  {transform:translateX(4%);animation-timing-function:cubic-bezier(.4,0,.3,1)}
  68%  {transform:translateX(0)}
  100% {transform:translateX(0)}}

.go .fade{animation:fade 1.7s linear both}
@keyframes fade{0%{opacity:0}4%,100%{opacity:1}}

/* i due cubetti */
.go .cubo1{animation:cubo1 1.7s cubic-bezier(.45,0,.72,1) both}
@keyframes cubo1{
  0%,8%{transform:translateY(-152px) rotate(-34deg);opacity:0}
  11%{opacity:1}
  27%{transform:translateY(7px) rotate(9deg);opacity:1}
  32%{transform:translateY(-6px) rotate(-4deg)}
  40%,100%{transform:translateY(0) rotate(0);opacity:1}}
.go .cubo2{animation:cubo2 1.7s cubic-bezier(.45,0,.72,1) both}
@keyframes cubo2{
  0%,14%{transform:translateY(-164px) rotate(28deg);opacity:0}
  17%{opacity:1}
  34%{transform:translateY(6px) rotate(-8deg);opacity:1}
  39%{transform:translateY(-5px) rotate(3deg)}
  47%,100%{transform:translateY(0) rotate(0);opacity:1}}

/* il livello che sobbalza a ogni cubetto */
.go .livello{animation:livello 1.7s cubic-bezier(.3,.9,.4,1) both}
@keyframes livello{
  0%  {transform:translateY(76px)}
  22% {transform:translateY(28px)}
  27% {transform:translateY(14px)}
  32% {transform:translateY(20px)}
  38% {transform:translateY(4px)}
  48%,100%{transform:translateY(7px)}}

/* schizzi */
.go .schizzo{animation:schizzo 1.7s ease-out both}
@keyframes schizzo{0%,25%{opacity:0;transform:translateY(0) scale(.3)}
  32%{opacity:.85;transform:translateY(-15px) scale(1)}
  46%,100%{opacity:0;transform:translateY(-3px) scale(.5)}}


/* ================= schermata d'apertura ================= */
#apertura{position:fixed;top:0;left:0;width:100%;height:100dvh;z-index:300;display:flex;background:
  radial-gradient(122% 100% at 106% 108%, rgba(255,173,1,.30), transparent 58%),
  radial-gradient(90% 64% at 88% 86%, rgba(201,141,39,.2), transparent 60%),
  radial-gradient(88% 58% at -8% -6%, rgba(239,95,60,.12), transparent 58%),
  var(--sfondo);
  flex-direction:column;align-items:center;justify-content:center;
  padding:calc(14px + env(safe-area-inset-top)) 26px calc(18px + env(safe-area-inset-bottom));
  transition:opacity .7s var(--dolce),visibility .7s}
#apertura.via{opacity:0;visibility:hidden;pointer-events:none}
#apertura .scudo{position:relative;width:min(238px,58vw);aspect-ratio:1;flex:0 0 auto;
  margin-top:-4vh}
@keyframes svela{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
#apertura .barra{width:120px;height:3px;border-radius:999px;background:rgba(255,255,255,.14);
  margin-top:26px;overflow:hidden;z-index:5;position:relative}
#apertura .barra i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,#FFFFFF,rgba(255,255,255,.7));
  animation:carico 2.2s linear forwards;box-shadow:0 0 10px rgba(255,255,255,.35)}
@keyframes carico{to{width:100%}}

/* ---- transizione liquida verso la home ---- */
#onda{position:fixed;left:0;top:0;width:100%;height:220dvh;z-index:400;pointer-events:none;
  visibility:hidden}
#onda.va{visibility:visible}
#onda .strato{position:absolute;left:-1%;top:0;width:102%;height:100%;
  transform:translateY(100dvh)}
#onda .strato svg{width:100%;height:100%;display:block}
#onda.va .s2{animation:risacca 1s cubic-bezier(.5,.02,.48,1) forwards}
#onda.va .s1{animation:risacca 1s .11s cubic-bezier(.5,.02,.48,1) forwards}
@keyframes risacca{from{transform:translateY(100dvh)}to{transform:translateY(-228dvh)}}


/* ---- l'onda nera che scende e copre il cocktail ---- */
#calo{position:absolute;left:0;top:0;width:100%;height:210dvh;z-index:6;pointer-events:none;
  transform:translateY(-212dvh)}
#calo .lama{position:absolute;left:-1%;top:0;width:102%;height:100%}
#calo svg{width:100%;height:100%;display:block}
#apertura.cala .l2{animation:cala 1s cubic-bezier(.55,.02,.4,1) forwards}
#apertura.cala .l1{animation:cala 1s .1s cubic-bezier(.55,.02,.4,1) forwards}
@keyframes cala{from{transform:translateY(-212dvh)}to{transform:translateY(0)}}

/* ---- il marchio, che emerge dal nero ---- */
#marchio{position:absolute;inset:0;z-index:7;opacity:0;pointer-events:none;overflow:hidden}
#apertura.svelato #marchio{animation:emergi 1s cubic-bezier(.33,0,.22,1) forwards}
@keyframes emergi{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
#marchio .scena{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:center 42%}
#marchio .velo-basso{position:absolute;left:0;right:0;bottom:0;height:46%;
  background:linear-gradient(to top,rgba(4,3,5,.95) 12%,rgba(4,3,5,.6) 46%,transparent)}
#marchio .firma-bianca{position:absolute;left:0;right:0;
  bottom:calc(38px + env(safe-area-inset-bottom));display:flex;flex-direction:column;
  align-items:center;gap:11px;padding:0 26px;text-align:center}
#marchio .cerchio-dm{width:50px;height:50px;display:block}
#marchio .firma-bianca b{font-size:14.5px;font-weight:700;color:#fff;letter-spacing:-.012em}
#marchio .firma-bianca span{font-size:13px;font-weight:500;color:rgba(255,255,255,.78);
  letter-spacing:.03em;margin-top:-4px}

/* ============ impalcatura ============ */
#app{position:absolute;inset:0;overflow:hidden;
  background:var(--ambiente,none),var(--sfondo)}

/* ---- il vetro ---- */
.gl{position:relative;isolation:isolate;background:var(--vetro);
  backdrop-filter:var(--sfoca);-webkit-backdrop-filter:var(--sfoca);
  box-shadow:0 10px 34px rgba(20,20,28,.10),var(--rim),var(--bordo)}
.gl::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;
  pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 32%,transparent 62%)}
.gl.forte{background:var(--vetro-forte)}
.gl.scuro{background:var(--vetro-scuro);color:#fff;
  box-shadow:0 8px 26px rgba(0,0,0,.22),var(--rim-scuro)}
.gl.scuro::after{background:linear-gradient(135deg,rgba(255,255,255,.4),
  rgba(255,255,255,.06) 32%,transparent 62%)}
@supports (backdrop-filter:url(#lente)){
  .gl.lente{backdrop-filter:blur(2px) url(#lente) blur(10px) saturate(180%) brightness(1.06)}
}
/* materia solida: il contenuto non e vetro, ma prende il filo di luce */
.solido{background:var(--carta);box-shadow:var(--o1),var(--carta-tratto)}
.vista{position:absolute;inset:0;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  background:transparent;animation:ent .46s var(--dolce) both}
@keyframes ent{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.testa{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(8px + env(safe-area-inset-top)) 17px 4px;position:relative;z-index:6}
.testa::after{content:"";position:absolute;left:0;right:0;top:100%;height:22px;
  pointer-events:none;background:linear-gradient(180deg,rgba(11,10,12,.85),transparent)}
.scorre{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 17px 12px;scrollbar-width:none;background:transparent;
  overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain}
.scorre::-webkit-scrollbar{display:none}
.fermo{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  padding:0 17px 8px;background:transparent}
/* il margine di sicurezza lo mette SOLO chi tocca davvero il fondo dello schermo */
.vista>.fermo:last-child{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.vista>.scorre:last-child{padding-bottom:calc(14px + env(safe-area-inset-bottom))}

/* ============ comandi ============ */
.tondo{width:44px;height:44px;border-radius:999px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;transition:transform .16s var(--molla);
  position:relative;isolation:isolate;background:var(--vetro-forte);
  backdrop-filter:var(--sfoca-lieve);-webkit-backdrop-filter:var(--sfoca-lieve);
  box-shadow:0 6px 20px rgba(20,20,28,.10),var(--rim),var(--bordo)}
.tondo::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:999px;
  pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(140deg,rgba(255,255,255,.6),transparent 55%)}
.tondo:active{transform:scale(.88)}
.tondo.velato{background:rgba(255,255,255,.18);color:#fff;
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  box-shadow:0 8px 24px rgba(0,0,0,.22),var(--rim-scuro)}
.tondo.velato::after{background:linear-gradient(140deg,rgba(255,255,255,.42),transparent 58%)}
.cta{width:100%;height:54px;flex:0 0 auto;border-radius:999px;display:flex;align-items:center;
  justify-content:center;gap:10px;font-size:16.5px;font-weight:700;letter-spacing:-.02em;
  color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(158deg,#E96A3E,#B8341C 62%,#8E2312);
  box-shadow:0 14px 34px rgba(0,0,0,.5),0 4px 16px rgba(184,52,28,.34),
    inset 0 1px 0 rgba(255,255,255,.34),inset 0 -10px 20px rgba(0,0,0,.24),
    inset 0 0 0 1px rgba(255,255,255,.12);transition:transform .14s,box-shadow .2s}
.cta::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(72% 60% at 26% 12%,rgba(255,255,255,.24),transparent 64%)}
.cta>*{position:relative;z-index:1}
.cta{transition:transform .18s var(--molla),box-shadow .24s}
.cta:active{transform:scale(.965);box-shadow:0 6px 18px rgba(220,65,40,.28)}
.cta.verde{background:linear-gradient(158deg,#2F8A61,#14563A 62%,#0B3323);
  box-shadow:0 14px 34px rgba(0,0,0,.5),0 4px 16px rgba(20,86,58,.3),
    inset 0 1px 0 rgba(255,255,255,.3),inset 0 -10px 20px rgba(0,0,0,.24),
    inset 0 0 0 1px rgba(255,255,255,.12)}
.cta.verde:active{box-shadow:0 6px 18px rgba(38,117,79,.24)}
.cta.grigia{background:linear-gradient(158deg,rgba(255,255,255,.1),rgba(255,255,255,.05));
  color:var(--grigio);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.cta.bianca{color:var(--ink);
  background:linear-gradient(158deg,rgba(255,255,255,.19),rgba(255,255,255,.075));
  backdrop-filter:var(--sfoca);-webkit-backdrop-filter:var(--sfoca);
  box-shadow:0 12px 32px rgba(0,0,0,.46),inset 0 1px 1px rgba(255,255,255,.4),
    inset 0 -8px 16px rgba(0,0,0,.2),inset 0 0 0 1px rgba(255,255,255,.18)}
.cta[disabled]{opacity:.45;pointer-events:none;box-shadow:none}
.link{display:block;width:100%;text-align:center;padding:10px 0 2px;font-size:14px;
  flex:0 0 auto;
  font-weight:600;color:#C1503C}
.link.neutro{color:var(--grigio)}

/* ============ testo ============ */
.occhio{font-size:13px;font-weight:600;color:var(--grigio)}
.titolone{font-weight:800;font-size:clamp(27px,7.4vw,35px);line-height:1.08;letter-spacing:-.038em}
.paragrafo{color:var(--grigio);font-size:15.5px;line-height:1.52;font-weight:500}
.sezione{display:flex;align-items:baseline;justify-content:space-between;margin:13px 0 7px}
.sezione h3{font-size:17.5px}
.sezione .piu{font-size:13.5px;font-weight:700;color:var(--arancio)}

/* ============ home ============ */
.pillastat{display:flex;align-items:center;border-radius:22px;padding:11px 16px;
  flex:0 0 auto;margin-top:9px;position:relative;isolation:isolate;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.022));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.07),
    0 10px 28px rgba(0,0,0,.5)}

.pillastat .s{flex:1;display:flex;align-items:center;gap:12px}
.pillastat .sep{width:1px;height:30px;background:rgba(255,255,255,.1);flex:0 0 auto}
.pillastat .v{font-size:18px;font-weight:800;line-height:1}
.pillastat .k{font-size:11.5px;color:rgba(245,242,236,.5);margin-top:2px;font-weight:500}
.tabbar{flex:0 0 auto;display:flex;border-radius:30px;padding:7px 8px 6px;gap:4px;
  margin:8px 17px calc(8px + env(safe-area-inset-bottom));
  position:relative;isolation:isolate;
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));
  backdrop-filter:var(--sfoca);-webkit-backdrop-filter:var(--sfoca);
  box-shadow:0 18px 44px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.17),
    inset 0 0 0 1px rgba(255,255,255,.07)}
@supports (backdrop-filter:url(#lente)){
  .tabbar{backdrop-filter:blur(2px) url(#lente) blur(12px) saturate(180%) brightness(1.06)}}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:11.5px;font-weight:600;color:rgba(245,242,236,.44);text-align:center;
  padding:7px 4px 5px;border-radius:999px;transition:all .28s var(--molla)}
.tabbar button[aria-current="page"]{color:var(--arancio);font-weight:700;
  background:radial-gradient(120% 100% at 50% 0%, rgba(239,95,60,.16), rgba(255,255,255,.05));
  box-shadow:inset 0 0 0 1px rgba(239,95,60,.24),inset 0 1px 0 rgba(255,255,255,.14)}
.tabbar .pun{width:5px;height:5px;border-radius:999px;background:var(--arancio);opacity:0;
  box-shadow:0 0 9px rgba(239,95,60,.8)}
.tabbar button[aria-current="page"] .pun{opacity:1}

/* ============ ricerca e filtri ============ */
.cerca{display:flex;align-items:center;gap:11px;border-radius:999px;
  padding:0 18px;height:52px;flex:0 0 auto;background:var(--vetro-forte);
  backdrop-filter:var(--sfoca);-webkit-backdrop-filter:var(--sfoca);
  box-shadow:0 6px 20px rgba(20,20,28,.08),var(--rim),var(--bordo)}
.cerca input{flex:1;min-width:0;border:0;background:none;font-family:inherit;font-size:15px;
  font-weight:500;color:var(--ink)}
.cerca input::placeholder{color:var(--grigio)}
.cerca input:focus{outline:none}
.filtri{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 4px;margin:0 -20px;
  scrollbar-width:none;flex:0 0 auto}
.filtri::-webkit-scrollbar{display:none}
.filtro{flex:0 0 auto;border-radius:999px;padding:10px 16px;font-size:13.5px;font-weight:600;
  color:var(--ink2);white-space:nowrap;transition:all .24s var(--molla);
  background:rgba(255,255,255,.085);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.13),var(--bordo)}
.filtro[aria-pressed="true"]{color:#fff;
  background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.13));
  box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.45),
    inset 0 0 0 1px rgba(255,255,255,.2)}

/* ============ voce d'elenco ============ */
.drink{display:flex;align-items:center;gap:14px;width:100%;background:var(--carta);
  border-radius:22px;padding:10px;margin-bottom:10px;transition:transform .18s var(--molla);
  box-shadow:var(--o1),var(--carta-tratto)}
.drink:active{transform:scale(.985)}
.drink .fot{width:78px;height:78px;border-radius:15px;flex:0 0 auto;position:relative;
  overflow:hidden;display:flex;align-items:center;justify-content:center}
.drink .fot .vetro{width:82%;height:82%}
.drink .mid{flex:1;min-width:0}
.drink .n{display:block;font-weight:700;font-size:18px;line-height:1.18;letter-spacing:-.028em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drink .s{display:block;font-size:13px;color:var(--grigio);font-weight:500;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drink .fr{color:rgba(255,255,255,.3);font-size:21px;flex:0 0 auto;padding-right:8px}
.vuoto{text-align:center;color:var(--grigio);font-size:14.5px;padding:56px 24px;line-height:1.6}

/* ============ scheda drink ============ */
.eroe{flex:0 0 auto;height:clamp(196px,27dvh,258px);position:relative;overflow:hidden}
.eroe .vel{position:absolute;inset:0;z-index:1;
  background:linear-gradient(to top,rgba(10,6,4,.88) 6%,rgba(10,6,4,.5) 34%,
    rgba(10,6,4,.1) 62%,rgba(10,6,4,.32))}
.eroe .alto{position:absolute;top:calc(12px + env(safe-area-inset-top));left:20px;right:20px;
  display:flex;justify-content:space-between;z-index:3}
.eroe .art{position:absolute;left:50%;transform:translateX(-50%);bottom:32%;
  width:auto;height:60%;aspect-ratio:200/210;z-index:1;opacity:.9}
.eroe .basso{position:absolute;left:17px;right:17px;bottom:34px;z-index:2;color:#fff;
  text-align:center}
.eroe h1{font-weight:800;font-size:clamp(26px,7.2vw,34px);line-height:1.04;letter-spacing:-.04em;
  text-shadow:0 3px 22px rgba(0,0,0,.45)}
.eroe .meta{font-size:13px;font-weight:500;opacity:.9;margin-top:7px;line-height:1.35}
.telo{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  border-radius:30px 30px 0 0;margin-top:-22px;position:relative;z-index:4;
  padding:8px 17px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(28,26,32,.72),rgba(11,10,12,.96) 26%);
  backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);
  box-shadow:0 -12px 44px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.22)}
.presa{width:38px;height:4px;border-radius:999px;background:rgba(255,255,255,.24);margin:0 auto 11px;flex:0 0 auto}

.segm{display:flex;border-radius:999px;padding:4px;gap:2px;flex:0 0 auto;margin-top:4px;
  background:rgba(255,255,255,.42);backdrop-filter:var(--sfoca-lieve);
  -webkit-backdrop-filter:var(--sfoca-lieve);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),var(--bordo)}
.segm button{flex:1;border-radius:999px;padding:11px 0;font-size:13.5px;font-weight:700;
  color:var(--grigio);text-align:center;transition:all .22s}
.segm button[aria-pressed="true"]{color:#fff;
  background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.12));
  box-shadow:0 3px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35)}

.dosi{background:var(--carta);border-radius:20px;padding:4px 18px;
  box-shadow:var(--o1),var(--carta-tratto)}
.dose{display:flex;align-items:center;gap:13px;padding:11px 0}
.dose+.dose{border-top:1px solid var(--lieve)}
.dose .pt{width:11px;height:11px;border-radius:999px;flex:0 0 auto;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.dose .n{flex:1;min-width:0;font-size:15.5px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dose .q{font-size:17px;font-weight:800;flex:0 0 auto;letter-spacing:-.03em}
.dose .q i{font-style:normal;font-size:12px;color:var(--grigio);font-weight:600;margin-left:3px}
.servizio{display:flex;background:var(--carta);border-radius:18px;padding:13px 4px;
  box-shadow:var(--o1),var(--carta-tratto);
  flex:0 0 auto;margin:13px 0 0}
.servizio div{flex:1;min-width:0;text-align:center;padding:0 8px;position:relative}
.servizio div+div::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:1px;
  background:var(--lieve)}
.servizio span{display:block;font-size:11.5px;color:var(--grigio);font-weight:500}
.servizio b{display:block;font-size:14px;font-weight:600;margin-top:4px;line-height:1.25}
.riquadro{background:var(--carta);border-radius:20px;padding:17px 19px;
  box-shadow:var(--o1),var(--carta-tratto)}
.riquadro .k{font-size:12px;font-weight:700;color:var(--grigio);margin-bottom:6px}
.riquadro p{font-size:14.5px;line-height:1.55;color:var(--ink2)}
.dose.chiesta .q{color:var(--arancio)}
.riquadro p.sr{font-size:15px;line-height:1.55;color:var(--ink2);font-weight:500}

/* ---- ingredienti che non entrano nel riquadro ---- */
/* il corpo scorre quando il contenuto non ci sta; i tasti restano in fondo */
.telo .corpo{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  touch-action:pan-y;scrollbar-width:none;
  display:flex;flex-direction:column;padding-bottom:14px;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.telo .corpo::-webkit-scrollbar{display:none}
.dosibox{position:relative;flex:0 0 auto;display:flex;flex-direction:column}
.telo>.cta{flex:0 0 auto;margin-top:0}
.telo.espansa .corpo{overflow:hidden}
.telo.espansa .dosibox{flex:1 1 auto;min-height:0}
.dosibox .dosi{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none;padding-right:26px}
.dosibox .dosi::-webkit-scrollbar{display:none}
.sfuma{position:absolute;left:3px;right:3px;bottom:3px;height:46px;pointer-events:none;
  border-radius:0 0 20px 20px;opacity:0;transition:opacity .25s;
  background:linear-gradient(to top,#151418 24%,rgba(21,20,24,0))}
.dosibox.trabocca .sfuma{opacity:1}
.scia{position:absolute;right:11px;top:16px;bottom:16px;width:3px;border-radius:999px;
  background:var(--lieve);opacity:0;transition:opacity .25s}
.dosibox.trabocca .scia{opacity:1}
.scia i{position:absolute;left:0;width:3px;border-radius:999px;
  background:linear-gradient(180deg,#FFC24A,#E96A3E);
  transition:top .1s linear}
.altri{display:none;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:9px 0;margin-top:7px;border-radius:16px;background:var(--carta);
  box-shadow:var(--o1),var(--carta-tratto);
  font-size:13px;font-weight:700;color:var(--ink);flex:0 0 auto}
.altri.si{display:flex}
.altri svg{transition:transform .28s}
.telo.espansa .altri svg{transform:rotate(180deg)}
.telo.espansa .servizio,.telo.espansa .link,.telo.espansa .segm,
.telo.espansa .cta,.telo.espansa .sezione{display:none}
.telo.espansa .dosibox{margin-top:4px}
.telo.espansa .dosibox .dosi{overflow:auto;padding-right:18px;
  display:flex;flex-direction:column;justify-content:space-evenly}
.telo.espansa .dose{flex:0 1 auto;min-height:0}
.telo.espansa .sfuma,.telo.espansa .scia{display:none!important}
.telo.espansa .tuttotitolo{display:flex}
.tuttotitolo{display:none;align-items:baseline;justify-content:space-between;flex:0 0 auto;
  margin:2px 0 9px}
.tuttotitolo h3{font-size:19px;font-weight:800;letter-spacing:-.032em}

/* ============ preparazione ============ */
.prep{position:absolute;inset:0;display:flex;flex-direction:column;color:#fff;overflow:hidden}
.prep .vel{position:absolute;inset:0;background:linear-gradient(to bottom,
  rgba(10,6,4,.3),rgba(10,6,4,.06) 38%,rgba(10,6,4,.62))}
.prep .cont{position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom))}
.prep .capo{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.prep .capo .p{font-size:13px;font-weight:700;background:rgba(255,255,255,.16);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  padding:9px 16px;border-radius:999px;box-shadow:var(--rim-scuro)}
.prep .scena{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  gap:14px;padding:10px 0}
.prep .scena .vaso{width:44%;max-width:190px;height:100%;display:flex;align-items:center}
.prep .scena .testo{flex:1;min-width:0}
.prep .quanto{font-size:clamp(46px,14vw,64px);font-weight:800;letter-spacing:-.055em;line-height:.9;
  text-shadow:0 3px 26px rgba(0,0,0,.28)}
.prep .quanto span{font-size:.34em;font-weight:700;letter-spacing:-.02em;opacity:.82}
.prep .che{font-weight:700;font-size:clamp(20px,5.6vw,26px);line-height:1.12;
  letter-spacing:-.03em;margin-top:8px}
.prep .come{font-size:13.5px;font-weight:500;opacity:.86;line-height:1.45;margin-top:8px}
.prep .titolo{font-weight:800;font-size:clamp(30px,8.4vw,40px);line-height:1.04;
  letter-spacing:-.038em;text-shadow:0 3px 26px rgba(0,0,0,.28)}
.plista{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.pr{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:16px;font-size:14px;
  font-weight:600;background:rgba(255,255,255,.16);
  box-shadow:var(--rim-scuro);transition:all .3s var(--molla)}
.pr .s{width:16px;text-align:center;font-size:12px}
.pr .n{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .q{font-weight:800}
.pr.fatto{opacity:.5}
.pr.ora{background:rgba(255,255,255,.32);
  box-shadow:0 10px 26px rgba(0,0,0,.24),inset 0 1px 1px rgba(255,255,255,.7),
    inset 0 0 0 1px rgba(255,255,255,.4)}
.pr.dopo{opacity:.44;background:rgba(255,255,255,.07)}
.prep .cta.bianca{color:#fff;background:rgba(255,255,255,.19);
  backdrop-filter:blur(22px) saturate(140%) brightness(1.3);
  -webkit-backdrop-filter:blur(22px) saturate(140%) brightness(1.3);
  box-shadow:0 12px 32px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.5),
    inset 0 0 0 1px rgba(255,255,255,.24)}

/* ============ quiz ============ */
.avanz{flex:1;height:7px;border-radius:999px;background:var(--lieve);overflow:hidden}
.avanz i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,#5FC79A,#2F8A61);
  box-shadow:0 0 12px rgba(95,199,154,.4);transition:width .45s cubic-bezier(.3,.8,.3,1)}
.qdrink{display:flex;align-items:center;gap:13px;border-radius:22px;padding:10px;flex:0 0 auto;
  background:var(--vetro-forte);backdrop-filter:var(--sfoca);-webkit-backdrop-filter:var(--sfoca);
  box-shadow:0 8px 26px rgba(20,20,28,.10),var(--rim),var(--bordo)}
.qdrink .fot{width:78px;height:78px;border-radius:15px;flex:0 0 auto;position:relative;
  overflow:hidden;display:flex;align-items:center;justify-content:center}
.qdrink .fot .vetro{width:84%;height:84%}
.qdrink .mid{flex:1;min-width:0}
.qdrink .n{display:block;font-weight:700;font-size:20px;line-height:1.14;letter-spacing:-.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qdrink .s{display:block;font-size:13.5px;color:var(--grigio);font-weight:500;margin-top:4px}
.badge{display:inline-block;margin-top:8px;background:var(--verde-chiaro);color:var(--verde);
  border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.badge.a{background:rgba(240,169,58,.18);color:#F0A93A}
.badge.b{background:rgba(239,95,60,.18);color:#F07E62}
.badge.n{background:rgba(255,255,255,.1);color:rgba(245,242,236,.7)}
.qlista{flex:1 1 auto;min-height:0;overflow:hidden;padding:3px 15px;
  display:flex;flex-direction:column}
.qlista .dose{flex:1 1 0;min-height:0;padding:5px 0;gap:11px}
.qlista .dose .n{font-size:14.5px}
.qlista .dose .q{font-size:16px}
.qlista .dose .pt{width:10px;height:10px}
.qlista .dose.chiesta{margin:0 -6px;padding-left:10px;padding-right:10px}
.dose.chiesta{background:var(--rosa);margin:0 -8px;padding-left:12px;padding-right:12px;
  border-radius:14px}
.dose.chiesta .n{font-weight:700}
.dose.chiesta .q{color:var(--arancio)}
.dose.svelata .q{color:var(--verde)}
.aiuti{display:flex;gap:9px;flex:0 0 auto;margin-top:8px}
.aiuto{flex:1;border-radius:18px;padding:9px 9px;
  display:flex;align-items:center;gap:11px;transition:transform .16s var(--molla),background .2s;
  background:var(--vetro-forte);backdrop-filter:var(--sfoca-lieve);
  -webkit-backdrop-filter:var(--sfoca-lieve);
  box-shadow:0 5px 16px rgba(20,20,28,.07),var(--rim),var(--bordo);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.aiuto .t{font-size:13.5px;font-weight:700;line-height:1.15}
.aiuto small{display:block;font-size:11px;font-weight:500;color:var(--grigio);margin-top:2px}
.aiuto:active{transform:scale(.97)}
.aiuto.giu{color:#fff;background:linear-gradient(158deg,rgba(255,255,255,.3),rgba(255,255,255,.13));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.22)}
.aiuto.giu small{color:rgba(255,255,255,.6)}
.aiuto.giu svg{stroke:#fff}
.qdom{text-align:center;flex:0 0 auto;padding:11px 0 9px}
.qdom .k{font-size:13px;font-weight:500;color:var(--grigio)}
.qdom .v{font-size:clamp(22px,6.2vw,27px);font-weight:800;letter-spacing:-.035em;margin-top:5px;
  line-height:1.18}
.qdom .v b{color:var(--arancio);font-weight:800}
.risposte{display:grid;grid-template-columns:1fr 1fr;gap:11px;flex:0 0 auto}
.risp{height:58px;border-radius:20px;display:flex;position:relative;isolation:isolate;
  align-items:center;justify-content:center;gap:5px;font-size:21px;font-weight:800;
  letter-spacing:-.03em;transition:all .22s var(--molla);border:2px solid transparent;
  background:rgba(255,255,255,.085);
  box-shadow:0 5px 16px rgba(0,0,0,.35),var(--rim),var(--bordo)}
.risp::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;
  pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(140deg,rgba(255,255,255,.5),transparent 58%)}
.risp i{font-style:normal;font-size:12.5px;color:var(--grigio);font-weight:600}
.risp:active{transform:scale(.965)}
.risp.scelta{border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.19);
  box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.4)}
.risp.si{color:#fff;border-color:rgba(120,220,170,.4);
  background:linear-gradient(158deg,#2F8A61,#123E2A);
  box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3),
    inset 0 -8px 16px rgba(0,0,0,.3)}
.risp.si i{color:rgba(255,255,255,.7)}
.risp.no{color:#fff;border-color:rgba(230,130,110,.4);
  background:linear-gradient(158deg,#9A3427,#3A110B);
  box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.26),
    inset 0 -8px 16px rgba(0,0,0,.3)}
.risp.no i{color:rgba(255,255,255,.7)}
.risp.giu{opacity:.3}

/* ============ livelli quiz ============ */
.regola{display:flex;gap:13px;align-items:flex-start;padding:13px 0}
.regola+.regola{border-top:1px solid var(--lieve)}
.regola .n{width:25px;height:25px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;
  font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;margin-top:1px}
.regola p{font-size:15px;line-height:1.5;color:var(--ink2)}

.pagine{display:flex;gap:7px;justify-content:center;align-items:center;flex:0 0 auto;padding:12px 0 4px}
.pagine i{width:7px;height:7px;border-radius:999px;background:rgba(255,255,255,.16)}
.pagine i.on{width:20px;background:linear-gradient(90deg,#FFC24A,#E96A3E)}
.colonna{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}

/* ---- selettore difficoltà ---- */
.livelli{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;
  gap:9px;overflow:hidden;padding:6px 0}
.liv{display:flex;align-items:center;gap:14px;width:100%;border-radius:20px;
  padding:0 14px;transition:transform .18s var(--molla);
  background:var(--vetro-forte);backdrop-filter:var(--sfoca-lieve);
  -webkit-backdrop-filter:var(--sfoca-lieve);
  box-shadow:0 6px 20px rgba(20,20,28,.08),var(--rim),var(--bordo);
  flex:1 1 0;min-height:62px;max-height:96px;overflow:hidden}
.liv:active{transform:scale(.985)}
.liv .tass{width:clamp(44px,11.5vw,52px);height:clamp(44px,11.5vw,52px);border-radius:16px;
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;
  font-size:22px;letter-spacing:-.03em;color:rgba(255,255,255,.94);
  position:relative;overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3),
    inset 0 -10px 18px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.11)}
.liv .tass::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(76% 58% at 28% 16%,rgba(255,255,255,.26),transparent 62%)}
.liv .mid{flex:1;min-width:0}
.liv .n{display:block;font-size:18.5px;font-weight:800;letter-spacing:-.03em;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.liv .s{display:block;font-size:13px;color:var(--grigio);font-weight:500;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.liv .fr{color:rgba(255,255,255,.3);flex:0 0 auto;display:flex}
.liv.scura{background:linear-gradient(122deg,rgba(255,173,1,.16),rgba(122,88,12,.2) 58%,
    rgba(18,14,6,.34));
  box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,214,120,.32),
    inset 0 -10px 20px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,190,60,.2)}
.liv.scura .n{color:#FFD68A}
.liv.scura .s{color:rgba(255,214,138,.62)}
.liv.scura .fr{color:rgba(255,214,138,.42)}
.divisore{display:flex;align-items:center;gap:11px;flex:0 0 auto;font-size:11px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--grigio);padding:1px 2px}
.divisore span{flex:1;height:1px;background:var(--lieve)}

/* ================= andiamo a bere ================= */
.mappa-testa{flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:calc(8px + env(safe-area-inset-top)) 16px 8px;z-index:12;position:relative}
.mappa-tit{flex:1;min-width:0;line-height:1.2}
.mappa-tit b{display:block;font-size:18px;font-weight:800;letter-spacing:-.032em}
.mappa-tit span{display:block;font-size:12.5px;color:var(--grigio);font-weight:600;margin-top:2px}

/* ---- filtri per categoria ---- */
.catfiltri{flex:0 0 auto;display:flex;gap:7px;overflow-x:auto;touch-action:pan-x;
  overscroll-behavior-x:contain;scrollbar-width:none;
  padding:2px 14px 10px;margin:0}
.catfiltri::-webkit-scrollbar{display:none}
.catf{flex:0 0 auto;display:flex;align-items:center;gap:7px;border-radius:999px;
  padding:8px 13px;font-size:13px;font-weight:700;white-space:nowrap;
  color:rgba(245,242,236,.6);background:rgba(255,255,255,.05);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:all .24s var(--molla)}
.catf .pal{max-width:11ch;overflow:hidden;text-overflow:ellipsis}
.catf i{font-style:normal;font-size:11px;font-weight:800;opacity:.55;
  background:rgba(255,255,255,.1);border-radius:999px;padding:1px 6px}
.catf[aria-pressed="true"]{color:rgb(var(--c,245,242,236));
  background:radial-gradient(120% 160% at 50% 0%, rgba(var(--c,255,255,255),.24), rgba(var(--c,255,255,255),.09));
  box-shadow:inset 0 0 0 1px rgba(var(--c,255,255,255),.42),
    inset 0 1px 0 rgba(255,255,255,.24), 0 6px 18px -8px rgba(var(--c,255,255,255),.6)}
.catf[aria-pressed="true"] i{background:rgba(var(--c,255,255,255),.22);opacity:.9}
.catf:active{transform:scale(.95)}

/* ---- la mappa ---- */
.mappa-guscio{position:relative;flex:0 0 auto;height:34dvh;min-height:190px;margin:0 14px;
  border-radius:24px;overflow:hidden;
  box-shadow:0 16px 44px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.1)}
#mappa{position:absolute;inset:0;background:#10120F;touch-action:none}
.leaflet-container{touch-action:none!important}
/* la base Esri e gia scura: le do solo un tocco caldo e piu contrasto */
#mappa .leaflet-tile-pane{filter:saturate(.85) contrast(1.16) brightness(1.14)
  sepia(.14) hue-rotate(-8deg)}
/* col ripiego su OpenStreetMap serve il negativo */
#mappa.ripiego .leaflet-tile-pane{filter:invert(1) hue-rotate(185deg) brightness(.82)
  contrast(1.05) saturate(.55) sepia(.2)}
#mappa .leaflet-shadow-pane{filter:none}
.mappa-vel{position:absolute;inset:0;pointer-events:none;z-index:410;border-radius:24px;
  box-shadow:inset 0 0 42px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.09)}
.mappa-stato{position:absolute;inset:0;z-index:500;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:0 30px;text-align:center;
  background:rgba(8,10,8,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mappa-stato.visibile{display:flex}
.mappa-stato p{font-size:14.5px;color:var(--ink2);line-height:1.5;font-weight:500}
.giro{width:30px;height:30px;border-radius:999px;border:3px solid rgba(255,255,255,.14);
  border-top-color:var(--arancio);animation:gira .9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* ---- dove sei tu ---- */
.qui{position:relative;width:26px;height:26px}
.qui b{position:absolute;left:7px;top:7px;width:12px;height:12px;border-radius:999px;
  background:#4FB3F6;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 16px rgba(79,179,246,.9)}
.qui i{position:absolute;inset:0;border-radius:999px;background:rgba(79,179,246,.4);
  animation:respira 2.4s ease-out infinite}
@keyframes respira{0%{transform:scale(.45);opacity:.85}70%{transform:scale(1.7);opacity:0}
  100%{transform:scale(1.7);opacity:0}}

/* ---- lo spillo ---- */
.spillo{width:38px;height:46px;position:relative;color:#fff;
  filter:drop-shadow(0 7px 12px rgba(0,0,0,.7))}
.spillo::before{content:"";position:absolute;left:2px;top:0;width:34px;height:34px;
  border-radius:999px 999px 999px 3px;transform:rotate(45deg);
  background:linear-gradient(150deg,rgb(var(--a)),rgba(0,0,0,.72));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.24),
    0 0 20px -4px rgba(var(--a),.8)}
.spillo .sg{position:absolute;left:0;top:6px;width:38px;display:flex;justify-content:center;z-index:2}
.spillo b{position:absolute;right:-1px;bottom:8px;min-width:16px;height:16px;border-radius:999px;
  background:#0B0A0C;color:rgb(var(--a));font-size:10px;font-weight:800;z-index:3;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
  box-shadow:inset 0 0 0 1.5px rgba(var(--a),.7)}

/* ---- elenco dei locali ---- */
.elenco-locali{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  touch-action:pan-y;scrollbar-width:none;
  padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
.elenco-locali::-webkit-scrollbar{display:none}
.elenco-locali .locale{display:flex;align-items:center;gap:13px;width:100%;border-radius:20px;
  padding:12px 14px;margin-bottom:9px;text-align:left;
  background:radial-gradient(130% 180% at 6% 50%, rgba(var(--c),.12), transparent 58%),
    linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));
  box-shadow:inset 0 0 0 1px rgba(var(--c),.2),inset 0 1px 0 rgba(255,255,255,.13),
    0 8px 22px -10px rgba(var(--c),.36),0 4px 14px rgba(0,0,0,.4);
  transition:transform .16s var(--molla)}
.elenco-locali .locale:active{transform:scale(.982)}
.elenco-locali .locale .num{width:38px;height:38px;border-radius:14px;flex:0 0 auto;position:relative;
  display:flex;align-items:center;justify-content:center;color:rgb(var(--c));
  background:radial-gradient(circle at 50% 30%, rgba(var(--c),.26), rgba(var(--c),.07));
  box-shadow:inset 0 0 0 1.4px rgba(var(--c),.46),0 0 18px -6px rgba(var(--c),.7)}
.elenco-locali .locale .num b{position:absolute;right:-4px;top:-4px;min-width:16px;height:16px;border-radius:999px;
  background:#0B0A0C;color:rgb(var(--c));font-size:9.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
  box-shadow:inset 0 0 0 1.2px rgba(var(--c),.6)}
.elenco-locali .locale .mid{flex:1;min-width:0}
.elenco-locali .locale .n{display:block;font-size:16px;font-weight:700;letter-spacing:-.024em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.elenco-locali .locale .s{display:block;font-size:12.5px;color:var(--grigio);font-weight:500;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.elenco-locali .locale .s em{font-style:normal;color:rgb(var(--c));font-weight:700}
.elenco-locali .locale .tag{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.elenco-locali .locale .tag i{font-style:normal;font-size:10.5px;font-weight:600;padding:3px 8px;
  border-radius:999px;color:rgba(245,242,236,.66);background:rgba(255,255,255,.07);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.elenco-locali .locale .dx{flex:0 0 auto;text-align:right;align-self:flex-start;padding-top:2px}
.elenco-locali .locale .km{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.02em}
.elenco-locali .locale .ap{display:block;font-size:10.5px;font-weight:700;margin-top:4px}
.elenco-locali .locale .ap.si{color:var(--verde)}.elenco-locali .locale .ap.no{color:rgba(245,242,236,.4)}

.allarga{display:block;width:100%;margin-top:10px;padding:15px;border-radius:16px;
  font-size:14.5px;font-weight:600;color:var(--oro);
  background:rgba(255,190,0,.05);
  box-shadow:inset 0 0 0 1px rgba(255,190,0,.3);
  transition:background .2s var(--curva,ease)}
.allarga:active{background:rgba(255,190,0,.12)}

/* ---- scheda del locale ---- */
.sfondobar{position:absolute;inset:-60px;z-index:0;pointer-events:none;
  background-size:cover;background-position:center 38%;
  filter:blur(19px) brightness(.55) saturate(1.15);transform:scale(1.08)}
.velo.scheda-luogo>.foglio{position:relative;z-index:2}
.velo.scheda-luogo{background:rgba(6,5,7,.42);
  backdrop-filter:blur(22px) saturate(140%) brightness(.66);
  -webkit-backdrop-filter:blur(22px) saturate(140%) brightness(.66);
  align-items:stretch;padding:calc(10px + env(safe-area-inset-top)) 9px
    calc(9px + env(safe-area-inset-bottom))}
.foglio.scheda-luogo{max-width:520px;margin:auto;border-radius:32px;max-height:100%;

  backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
  box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 1px 1px rgba(255,255,255,.26),
    inset 0 0 0 1px rgba(255,255,255,.11);
  animation:salep .48s var(--molla)}

.scheda-capo{display:flex;align-items:flex-start;gap:15px;margin:4px 0 16px}
.scheda-capo .ico{width:60px;height:60px;border-radius:20px;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;color:rgb(var(--c));
  background:radial-gradient(circle at 50% 26%, rgba(var(--c),.24), rgba(var(--c),.06));
  box-shadow:inset 0 0 0 1.6px rgba(var(--c),.62),0 0 30px -8px rgba(var(--c),.85),
    inset 0 1px 0 rgba(255,255,255,.2)}
.scheda-capo .tt{flex:1;min-width:0;padding-top:2px}
.scheda-capo h3{font-size:25px;letter-spacing:-.04em;line-height:1.08}
.scheda-capo .s{display:block;font-size:13.5px;color:rgba(245,242,236,.6);font-weight:500;
  margin-top:6px;line-height:1.35}
.scheda-capo .stato{display:block;font-size:14px;font-weight:700;margin-top:4px}
.scheda-capo .stato.ap{color:#4FD69A}
.scheda-capo .stato.ch{color:var(--oro)}

.sr-box{margin-bottom:13px;position:relative;padding:17px 19px;border-radius:22px;
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 0 0 1px rgba(255,255,255,.08)}
.sr{font-size:15px;line-height:1.62;color:rgba(245,242,236,.86)}
.sr.attesa{opacity:.45}
.sr-box .fonte{font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;

.sr-box .piu{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.sr-box .piu .link{width:auto;text-align:left;padding:0;font-size:15px;font-weight:600}
.tondello{width:38px;height:38px;border-radius:999px;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;color:#fff;
  background:rgba(255,255,255,.13);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.tondello.piccolo{width:34px;height:34px;color:var(--ink2)}

.pregi{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pregi span{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;
  padding:10px 15px;border-radius:999px;color:rgba(245,242,236,.9);
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.09)}
.pregi span svg{color:var(--oro);flex:0 0 auto}

.righe-info{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));
  border-radius:22px;padding:2px 18px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),inset 0 0 0 1px rgba(255,255,255,.075)}
.righe-info .dose{padding:14px 0}
.righe-info .n{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:500;
  color:rgba(245,242,236,.9)}
.righe-info .n svg{color:rgba(245,242,236,.5);flex:0 0 auto}
.righe-info .q{font-size:14.5px;font-weight:500;color:rgba(245,242,236,.62);
  text-align:right;max-width:56%}

.azioni{display:flex;gap:9px;margin:16px 0 17px}
.azione{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:15px 6px;border-radius:20px;color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.032));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 0 0 1px rgba(255,255,255,.085),
    0 8px 20px rgba(0,0,0,.34);transition:transform .16s var(--molla)}
.azione:active{transform:scale(.94)}
.azione span{font-size:11.5px;font-weight:600;color:rgba(245,242,236,.7);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.cta.grande{height:62px;font-size:17.5px;position:relative;justify-content:center}
.cta.grande .tondello{position:absolute;left:8px;top:50%;transform:translateY(-50%);
  width:46px;height:46px;background:rgba(255,255,255,.16);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.26)}

.leaflet-control-attribution{background:rgba(8,10,8,.78)!important;
  color:rgba(255,255,255,.55)!important;font-size:9px!important;padding:1px 5px!important}
.leaflet-control-attribution a{color:rgba(255,255,255,.78)!important}
.leaflet-bar a{background:rgba(16,18,15,.92)!important;color:#fff!important;
  border-color:rgba(255,255,255,.14)!important}
.leaflet-container{background:#10120F!important}

/* ================= striscia in fondo alla home ================= */

/* ================= impostazioni ================= */
.scelte{display:flex;gap:8px;overflow-x:auto;touch-action:pan-x;
  overscroll-behavior-x:contain;scrollbar-width:none;padding:2px 17px 2px;
  margin:0 -17px}
.scelte::-webkit-scrollbar{display:none}
.scelta{flex:0 0 auto;display:flex;align-items:center;gap:8px;border-radius:999px;
  padding:10px 15px;font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap;
  background:rgba(255,255,255,.06);transition:all .24s var(--molla);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.scelta[aria-pressed="true"]{color:#fff;
  background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.12));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.2)}
.scelta .bandiera{font-size:16px;line-height:1}
.pastiglie{display:flex;gap:3px}
.pastiglie i{width:12px;height:12px;border-radius:999px;box-shadow:0 0 0 1px rgba(255,255,255,.2)}

/* ============ profilo ============ */
.avatarone{width:66px;height:66px;border-radius:22px;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;color:#fff;font-size:23px;font-weight:800;
  position:relative;overflow:hidden;
  background:linear-gradient(152deg,#C4552F,#4A1409);
  box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3),
    inset 0 -10px 18px rgba(0,0,0,.34),inset 0 0 0 1px rgba(255,255,255,.12)}
.tris{display:flex;gap:10px}
.tris>div{flex:1;background:var(--carta);border-radius:18px;padding:15px 12px;
  box-shadow:var(--o1),var(--carta-tratto)}
.tris .v{font-size:22px;font-weight:800;letter-spacing:-.035em;line-height:1}
.tris .k{font-size:11.5px;color:var(--grigio);font-weight:500;margin-top:4px}
.nota{background:var(--carta);border-radius:18px;padding:15px 17px;margin-bottom:10px;
  box-shadow:var(--o1),var(--carta-tratto);display:flex;gap:12px;align-items:flex-start}
.nota .c{flex:1;min-width:0}
.nota .d{font-size:11.5px;font-weight:700;color:var(--arancio);margin-bottom:4px}
.nota p{font-size:14px;line-height:1.5;color:var(--ink2)}
.nota .x{width:30px;height:30px;border-radius:999px;background:rgba(255,255,255,.08);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--grigio)}

/* ============ campi ============ */
.campo{margin-bottom:12px}
.campo label{display:block;font-size:12px;font-weight:700;color:var(--grigio);margin-bottom:7px}
.campo input,.campo textarea{width:100%;background:var(--carta);border:2px solid transparent;
  border-radius:18px;box-shadow:var(--o1),var(--carta-tratto);font-family:inherit;font-size:16px;
  font-weight:600;padding:15px 17px;color:var(--ink)}
.campo textarea{min-height:120px;resize:none;font-weight:500;line-height:1.5;font-size:15px}
.campo input::placeholder,.campo textarea::placeholder{color:var(--grigio);font-weight:500}
.campo input:focus,.campo textarea:focus{outline:none;border-color:rgba(255,255,255,.5)}
.terna{display:grid;grid-template-columns:74px 80px 1fr;gap:8px;margin-bottom:9px}
.terna input,.terna select{background:var(--carta);border:2px solid transparent;border-radius:16px;
  box-shadow:var(--o1),var(--carta-tratto);font-family:inherit;font-size:14.5px;font-weight:600;
  padding:13px 12px;width:100%;min-width:0;color:var(--ink)}
.terna select{-webkit-appearance:none;appearance:none;text-align:center;font-size:13px}
.terna input:focus,.terna select:focus{outline:none;border-color:rgba(255,255,255,.5)}

/* ============ foglio e messaggi ============ */
.velo{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.62);
  backdrop-filter:blur(10px) saturate(120%);-webkit-backdrop-filter:blur(10px) saturate(120%);
  display:none;align-items:flex-end;justify-content:center}
.velo.on{display:flex}
.foglio{display:block;width:100%;max-width:520px;border-radius:32px 32px 0 0;
  padding:12px 20px calc(20px + env(safe-area-inset-bottom));max-height:88dvh;
  overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;
  background:linear-gradient(180deg,rgba(30,28,34,.9),rgba(16,15,19,.94));
  backdrop-filter:blur(34px) saturate(150%);-webkit-backdrop-filter:blur(34px) saturate(150%);
  box-shadow:0 -16px 56px rgba(0,0,0,.6),
    inset 0 1px 1px rgba(255,255,255,.24),inset 0 0 0 1px rgba(255,255,255,.1);
  animation:salep .42s var(--molla)}
@keyframes salep{from{transform:translateY(90px);opacity:.4}to{transform:none;opacity:1}}
.avviso{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));
  transform:translate(-50%,16px);color:#fff;border-radius:999px;
  background:rgba(46,44,52,.86);backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  box-shadow:0 12px 34px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.16);
  padding:14px 24px;font-size:13.5px;font-weight:700;z-index:90;opacity:0;pointer-events:none;
  transition:all .28s;white-space:nowrap;box-shadow:var(--o3)}
.avviso.on{opacity:1;transform:translate(-50%,0)}

/* ================= transizioni fra schermate ================= */
/* dissolvenza elegante */
@keyframes esceFade{from{opacity:1}to{opacity:0}}
@keyframes entraFade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.esce-fade{animation:esceFade .22s cubic-bezier(.5,0,.9,1) forwards}
.entra-fade{animation:entraFade .46s var(--dolce) both}

/* rotolo verticale: i testi salgono e ne entrano di nuovi da sotto */
@keyframes rotolaSu{to{opacity:0;transform:translateY(-46px)}}
@keyframes rotolaGiu{from{opacity:0;transform:translateY(54px)}to{opacity:1;transform:none}}
.rotola-su{animation:rotolaSu .2s cubic-bezier(.5,0,1,1) forwards}
.rotola-giu{animation:rotolaGiu .4s var(--molla) both}
.rotola-giu.dopo{animation-delay:.06s}
.vista.ferma{animation:none}

/* =====================================================================
   HOME — foglio di stile dedicato
   1 variabili · 2 superfici · 3 impianto · 4 barra laterale · 5 saluto
   6 intestazione · 7 ricerca · 8 carte · 9 banner · 10 tablet · 11 telefono
   Scritto in ordine crescente: telefono prima, poi tablet, poi computer.
   ===================================================================== */

/* ============ 1 · VARIABILI ============ */
:root{
  /* colori tematici */
  --arancione:255,80,25;
  --viola:120,90,255;
  --verde:0,190,110;
  --oro:255,190,0;

  /* superfici di vetro: scure, mai bianche traslucide */
  --vetro-fondo:rgba(255,255,255,.03);
  --vetro-fondo-su:rgba(255,255,255,.055);
  --vetro-bordo:rgba(255,255,255,.10);
  --vetro-bordo-su:rgba(255,255,255,.16);
  --vetro-sfoca:blur(20px);

  /* testo */
  --hp-testo:rgba(255,255,255,.95);
  --hp-testo-2:rgba(255,255,255,.58);
  --hp-testo-3:rgba(255,255,255,.40);

  /* misure fluide: crescono con la finestra ma non oltre */
  --barra-l:clamp(280px, calc(11vw + 114px), 340px);
  --bordo:clamp(20px, 3vw, 56px);
  --respiro:clamp(55px, 7vh, 90px);   /* intestazione -> carte */
  --stacco:clamp(20px, 2.9vh, 30px);  /* carte -> banner */
  --gap:clamp(16px, 1.6vw, 28px);
  --raggio:clamp(18px, 1.4vw, 24px);
  --raggio-p:clamp(14px, 1vw, 18px);
  --contenuto:1900px;
  --colonne:1;

  /* andatura */
  --tempo:200ms;
  --curva:cubic-bezier(.22,.61,.36,1);
}

/* ============ 2 · SUPERFICI RIUSABILI ============ */
.vetro{background:var(--vetro-fondo);
  box-shadow:inset 0 0 0 1px var(--vetro-bordo);
  backdrop-filter:var(--vetro-sfoca);-webkit-backdrop-filter:var(--vetro-sfoca)}
.badge-nuovo{display:inline-flex;align-items:center;
  font-size:clamp(9px,.6vw,10px);font-weight:800;letter-spacing:.1em;
  padding:3px 7px;border-radius:999px;margin-left:9px;vertical-align:middle;
  color:#ffc400;background:rgba(255,190,0,.15);
  box-shadow:inset 0 0 0 1px rgba(255,190,0,.4)}

/* ============ 3 · IMPIANTO ============ */
#lato{display:none}
.hp{display:block;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  touch-action:pan-y;overscroll-behavior:contain;scrollbar-width:none}
.hp::-webkit-scrollbar{display:none}
.hp-dentro{width:100%;max-width:var(--contenuto);margin-inline:auto;
  padding:0 var(--bordo) calc(var(--bordo) + env(safe-area-inset-bottom));
  display:flex;flex-direction:column}

/* ============ 5 · SALUTO (telefono) ============ */
.hp-saluto{flex:0 0 auto;
  padding:calc(14px + env(safe-area-inset-top)) var(--bordo) 12px}
.hp-saluto-testo{min-width:0}
.hp-saluto h1{font-size:clamp(23px,6.6vw,30px);font-weight:800;letter-spacing:-.035em;
  line-height:1.08}
.hp-saluto p{font-size:13.5px;color:var(--hp-testo-2);margin-top:5px;line-height:1.4}

/* ============ 6 · INTESTAZIONE (solo schermo largo) ============ */
.hp-testa{display:none}

/* ============ 7 · RICERCA ============ */
.hp-cerca{display:flex;align-items:center;gap:11px;height:48px;border-radius:16px;
  padding:0 16px;background:rgba(255,255,255,.035);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  color:var(--hp-testo-3);
  transition:box-shadow var(--tempo) var(--curva)}
.hp-cerca:focus-within{box-shadow:inset 0 0 0 1px rgba(255,255,255,.24)}
.hp-cerca input{flex:1;min-width:0;background:none;border:0;outline:0;
  font-family:inherit;font-size:14px;font-weight:500;color:var(--hp-testo)}
.hp-cerca input::placeholder{color:var(--hp-testo-3)}
.hp-cerca kbd{font-family:inherit;font-size:11px;font-weight:600;color:var(--hp-testo-3);
  padding:3px 7px;border-radius:6px;flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}

/* ============ 8 · LE TRE CARTE ============ */
.hp-griglia{display:grid;grid-template-columns:repeat(var(--colonne),minmax(0,1fr));
  gap:var(--gap);width:100%}
.hp-card{position:relative;display:grid;grid-template-rows:auto 1fr auto;
  border-radius:var(--raggio);overflow:hidden;text-align:left;
  padding:clamp(16px,1.35vw,26px);
  background:
    radial-gradient(circle at 50% 45%, rgba(var(--tema),.14), transparent 60%),
    radial-gradient(120% 90% at 50% 55%, rgba(var(--tema),.04), transparent 76%),
    #0A0A0C;
  box-shadow:inset 0 0 0 1px rgba(var(--tema),.22),
    0 20px 50px -26px rgba(var(--tema),.3), 0 6px 22px rgba(0,0,0,.45);
  transition:transform var(--tempo) var(--curva),
             box-shadow var(--tempo) var(--curva)}
.hp-card:focus-visible{outline:2px solid rgb(var(--tema));outline-offset:3px}

.hp-card-ico{grid-row:1;justify-self:start;
  width:clamp(42px,3.1vw,52px);height:clamp(42px,3.1vw,52px);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:rgb(var(--tema));
  box-shadow:inset 0 0 0 1.5px rgba(var(--tema),.5),
    0 0 26px -10px rgba(var(--tema),.9)}

/* l'illustrazione: riempie il contenitore mantenendo il proprio viewBox */
.hp-card-art{grid-row:2;place-self:center;width:72%;height:100%;min-height:0;
  display:flex;align-items:center;justify-content:center;pointer-events:none;
  filter:drop-shadow(0 18px 46px rgba(var(--tema),.42))}
.hp-card-art>svg{width:100%;height:100%;max-width:100%;max-height:100%}

.hp-card-piede{grid-row:3;display:flex;align-items:flex-end;gap:14px;
  justify-content:space-between}
.hp-card-testo{min-width:0}
.hp-card-titolo{display:block;font-size:clamp(19px,1.5vw,26px);font-weight:700;
  letter-spacing:-.03em;line-height:1.1}
.hp-card-desc{display:block;font-size:clamp(13px,.95vw,14px);line-height:1.4;
  margin-top:8px;color:var(--hp-testo-2);max-width:30ch}
.hp-card-freccia{flex:0 0 auto;width:clamp(40px,3vw,48px);height:clamp(40px,3vw,48px);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:rgb(var(--tema));background:rgba(var(--tema),.08);
  box-shadow:inset 0 0 0 1px rgba(var(--tema),.5);
  transition:transform var(--tempo) var(--curva),background var(--tempo) var(--curva)}
.hp-card:active{transform:scale(.99)}

/* ============ 9 · BANNER ============ */
.hp-banner{position:relative;display:grid;grid-template-columns:auto 1fr auto;
  align-items:center;gap:clamp(14px,1.4vw,26px);width:100%;text-align:left;
  margin-top:var(--gap);padding:clamp(14px,1.2vw,22px) clamp(16px,1.4vw,26px);
  min-height:clamp(76px,8vw,140px);border-radius:var(--raggio);
  background:radial-gradient(circle at 50% 50%, rgba(var(--tema),.08), transparent 65%),#0A0A0C;
  box-shadow:inset 0 0 0 1px rgba(var(--tema),.35),
    0 16px 40px -26px rgba(var(--tema),.3), 0 5px 20px rgba(0,0,0,.45);
  transition:transform var(--tempo) var(--curva),box-shadow var(--tempo) var(--curva)}
.hp-banner:active{transform:scale(.995)}
.hp-banner:focus-visible{outline:2px solid rgb(var(--tema));outline-offset:3px}
.hp-banner-ico{width:clamp(44px,4.4vw,76px);height:clamp(44px,4.4vw,76px);
  border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  color:rgb(var(--tema));
  box-shadow:inset 0 0 0 1.5px rgba(var(--tema),.5),0 0 26px -10px rgba(var(--tema),.8)}
.hp-banner-testo{min-width:0}
.hp-banner-titolo{display:block;font-size:clamp(16px,1.3vw,22px);font-weight:700;
  letter-spacing:-.03em;line-height:1.15}
.hp-banner-desc{display:block;font-size:clamp(12px,.95vw,14px);line-height:1.4;
  margin-top:5px;color:var(--hp-testo-2)}
.hp-banner-citta{display:none}
.hp-banner-freccia{flex:0 0 auto;width:clamp(40px,3vw,48px);height:clamp(40px,3vw,48px);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:rgb(var(--tema));background:rgba(var(--tema),.08);
  box-shadow:inset 0 0 0 1px rgba(var(--tema),.5)}

/* ============ 11 · TELEFONO: le carte riempiono lo schermo ============ */
@media (max-width:767px){
  /* Sul telefono la carta e bassa: l'illustrazione non puo stare su una
     riga propria fra icona e testo, non le resterebbe spazio. Va di lato,
     sovrapposta, come nella versione che funzionava. */
  .hp{display:flex;flex-direction:column}
  .hp-dentro{flex:1;min-height:0;padding-top:4px;padding-bottom:10px}
  .hp-griglia{flex:1 1 auto;min-height:0;
    grid-template-rows:repeat(3,minmax(0,1fr))}

  .hp-card{display:block;position:relative;aspect-ratio:auto;min-height:0;
    overflow:hidden;padding:14px 16px}
  .hp-card-ico{position:absolute;left:16px;top:14px;
    width:clamp(38px,10vw,46px);height:clamp(38px,10vw,46px);z-index:2}
  .hp-card-art{position:absolute;right:-7%;top:50%;transform:translateY(-50%);
    width:auto;height:104%;aspect-ratio:200/210;min-height:0;z-index:1;
    display:flex;align-items:center;justify-content:center}
  .hp-card-piede{position:absolute;left:16px;right:16px;bottom:14px;z-index:3;
    display:flex;align-items:flex-end;gap:12px;justify-content:space-between}
  .hp-card-testo{max-width:54%}
  .hp-card-titolo{font-size:clamp(19px,5.4vw,24px)}
  .hp-card-desc{font-size:13px;margin-top:5px;-webkit-line-clamp:2;
    display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
  .hp-card-freccia{width:42px;height:42px}

  .hp-banner{grid-template-columns:auto 1fr auto;min-height:60px;flex:0 0 auto}
  .hp-banner-desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}


/* ============ 10 · TABLET E COMPUTER ============ */
@media (min-width:768px){
  :root{--colonne:2}

  /* --- il tetto da telefono va tolto --- */
  .vista{max-width:none;margin:0;padding:0}
  .tabbar{display:none!important}
  .hp-saluto{display:none}

  /* --- 4 · BARRA LATERALE --- */
  #lato{display:flex;flex-direction:column;position:fixed;inset-block:0;left:0;z-index:20;
    width:var(--barra-l);
    padding:clamp(24px,2vw,36px);
    padding-bottom:calc(clamp(24px,2vw,36px) + env(safe-area-inset-bottom));
    background:rgba(7,7,9,.75);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    box-shadow:inset -1px 0 0 rgba(255,255,255,.1)}
  #app{left:var(--barra-l);width:auto}

  .lato-capo{flex:0 0 auto;padding-bottom:clamp(24px,2.4vw,40px)}
  .lato-titolo{font-size:clamp(22px,1.5vw,28px);font-weight:750;letter-spacing:-.03em;
    line-height:1.1}
  .lato-sub{font-size:clamp(13px,.9vw,14px);color:var(--hp-testo-2);margin-top:8px;
    line-height:1.4}

  .lato-nav{display:flex;flex-direction:column;gap:6px;
    flex:0 1 auto;min-height:0;overflow-y:auto;scrollbar-width:none}
  .lato-nav::-webkit-scrollbar{display:none}
  .nav-voce{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;
    padding:12px 16px;border-radius:28px;text-align:left;color:var(--hp-testo-2);
    transition:background var(--tempo) var(--curva),color var(--tempo) var(--curva)}
  .nav-voce svg{flex:0 0 auto}
  .nav-testo{flex:1;min-width:0}
  .nav-nome{display:block;font-size:clamp(14px,.95vw,15px);font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-sub{display:block;font-size:12px;color:var(--hp-testo-3);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-voce:hover{color:var(--hp-testo);background:rgba(255,255,255,.05)}
  .nav-voce[aria-current="page"]{color:#ff6335;
    background:linear-gradient(90deg, rgba(255,80,25,.22), rgba(255,80,25,.1));
    box-shadow:inset 0 0 0 1px rgba(255,80,25,.35), 0 0 26px rgba(255,80,25,.09)}
  .nav-oro{color:#ffc400}
  .nav-oro:hover{color:#ffd050}
  .nav-min{min-height:44px;padding:10px 16px}
  .nav-min .nav-nome{font-size:14px;font-weight:500}

  .lato-piede{margin-top:auto;flex:0 0 auto;padding-top:clamp(16px,1.6vw,28px)}
  .lato-cta{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;
    margin-bottom:10px;padding:12px 14px;border-radius:16px;text-align:left;
    color:#ffc400;
    background:linear-gradient(135deg, rgba(110,75,0,.28), rgba(40,28,0,.18));
    box-shadow:inset 0 0 0 1px rgba(255,190,0,.35);
    transition:transform var(--tempo) var(--curva),box-shadow var(--tempo) var(--curva)}
  .lato-cta:hover{box-shadow:inset 0 0 0 1px rgba(255,190,0,.55)}
  .lato-cta-ico{width:36px;height:36px;border-radius:50%;flex:0 0 auto;display:flex;
    align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 1.4px rgba(255,190,0,.5)}
  .lato-cta-testo{flex:1;min-width:0}
  .lato-cta-testo b{display:block;font-size:14px;font-weight:700;color:var(--hp-testo)}
  .lato-cta-testo span{display:block;font-size:11.5px;color:var(--hp-testo-3);
    margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lato-versione{font-size:10.5px;letter-spacing:.05em;color:rgba(255,255,255,.22);
    padding:12px 16px 0}

  /* --- impianto principale --- */
  .hp{min-height:100dvh}
  .hp-dentro{padding-top:clamp(70px, 7vh, 105px);
    padding-inline:clamp(28px, 3.2vw, 56px);
    padding-bottom:calc(clamp(40px,5vh,80px) + env(safe-area-inset-bottom))}

  /* --- 6 · INTESTAZIONE --- */
  .hp-testa{display:flex;justify-content:space-between;align-items:flex-start;
    gap:32px;flex-wrap:wrap;margin-bottom:var(--respiro)}
  .hp-testa-testo{min-width:0}
  .hp-testa h2{font-size:clamp(30px,2.2vw,40px);font-weight:750;letter-spacing:-.04em;
    line-height:1.08}
  .hp-testa p{font-size:clamp(13px,1vw,16px);color:var(--hp-testo-2);margin-top:9px;
    line-height:1.45;max-width:56ch}
  .hp-cerca{width:clamp(300px,21vw,390px);height:46px;flex:0 0 auto;align-self:flex-start}

  /* --- 8 · le carte prendono la proporzione della reference --- */
  .hp-card{aspect-ratio:1/1.195}
  /* l'icona e un dettaglio d'angolo: sta sopra, non su una riga propria,
     cosi l'illustrazione occupa tutta l'area superiore come nella reference */
  .hp-card{grid-template-rows:1fr auto}
  .hp-card-ico{position:absolute;left:clamp(16px,1.3vw,22px);top:clamp(16px,1.3vw,22px);
    z-index:2;grid-row:auto}
  .hp-card-art{grid-row:1;width:77%;height:100%}

  /* --- 9 · il banner con lo skyline --- */
  .hp-banner{grid-template-columns:auto auto 1fr auto;
    margin-top:var(--stacco);
    min-height:clamp(120px, 13.5vh, 140px);
    padding-inline:clamp(24px,1.6vw,30px)}
  .hp-banner-citta{display:block;width:100%;height:clamp(70px,7.5vh,104px);min-width:0;
    opacity:.8;pointer-events:none}
  .hp-banner-testo{max-width:38ch}
  .hp-banner-ico{width:clamp(56px,4.4vw,78px);height:clamp(56px,4.4vw,78px)}
  .hp-banner-freccia{width:clamp(44px,2.8vw,50px);height:clamp(44px,2.8vw,50px)}
}

/* --- tablet orizzontale 900-1199: barra compatta, due colonne --- */
@media (min-width:900px) and (max-width:1199px){
  :root{--barra-l:clamp(220px,20vw,240px);--bordo:clamp(24px,2.4vw,28px)}
}

/* --- tablet compatto 768-899: la barra si stringe ancora, altrimenti
       su un tablet in verticale si mangerebbe un terzo della larghezza --- */
@media (min-width:768px) and (max-width:899px){
  :root{--barra-l:clamp(190px,23vw,216px);--bordo:clamp(20px,2.6vw,26px);
    --gap:clamp(14px,2vw,18px)}
  #lato{padding:clamp(20px,2.6vw,26px)}
  .lato-titolo{font-size:19px}
  .lato-sub{font-size:12.5px}
  .lato-capo{padding-bottom:20px}
  .nav-voce{padding:11px 13px;gap:10px;border-radius:22px}
  .nav-nome{font-size:14px}
  .nav-sub{font-size:11.5px}
  .lato-cta{padding:11px 12px;gap:10px}
  .lato-cta-ico{width:32px;height:32px}
  .lato-cta-testo b{font-size:13px}
  .lato-cta-testo span{font-size:11px}
  .hp-dentro{padding-top:clamp(48px,5.5vh,72px)}
  .hp-testa{margin-bottom:clamp(36px,5vh,60px)}
  .hp-testa h2{font-size:26px}
  .hp-testa p{font-size:14px}
  .hp-cerca{width:100%;align-self:stretch}
  .hp-banner-testo{max-width:none}
}

/* --- computer: tre colonne --- */
@media (min-width:1200px){
  :root{--colonne:3}
}

/* --- hover solo dove il puntatore esiste davvero --- */
@media (hover:hover) and (pointer:fine){
  .hp-card:hover{transform:translateY(-2px);
    box-shadow:inset 0 0 0 1px rgba(var(--tema),.36),
      0 26px 60px -26px rgba(var(--tema),.42), 0 8px 26px rgba(0,0,0,.5)}
  .hp-card:hover .hp-card-freccia{background:rgba(var(--tema),.16);
    transform:translateX(2px)}
  .hp-banner:hover{box-shadow:inset 0 0 0 1px rgba(var(--tema),.5),
    0 22px 50px -26px rgba(var(--tema),.4), 0 6px 22px rgba(0,0,0,.5)}
}

/* --- tocco: bersagli sempre da 44px in su --- */
@media (pointer:coarse){
  .nav-voce,.nav-min,.lato-cta{min-height:48px}
}


/* =====================================================================
   DIARIO — stesso linguaggio della Home
   ===================================================================== */
.dia-intro{padding:6px 0 18px}
.dia-intro h3{font-size:clamp(21px,2vw,30px);font-weight:750;letter-spacing:-.035em;
  line-height:1.1}
.dia-intro p{font-size:clamp(13.5px,1vw,15px);color:var(--hp-testo-2);margin-top:8px;
  line-height:1.45;max-width:52ch}
.dia-elenco{display:grid;gap:10px}

/* --- una riga del diario --- */
.dia-riga{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:14px 16px;border-radius:var(--raggio-p,16px);
  background:var(--vetro-fondo,rgba(255,255,255,.03));
  box-shadow:inset 0 0 0 1px var(--vetro-bordo,rgba(255,255,255,.1));
  transition:background var(--tempo,200ms) var(--curva,ease),
             box-shadow var(--tempo,200ms) var(--curva,ease)}
.dia-riga:active{transform:scale(.99)}
.dia-num{flex:0 0 auto;width:46px;height:46px;border-radius:14px;display:flex;
  align-items:center;justify-content:center;font-size:14px;font-weight:800;
  letter-spacing:.04em;color:rgb(var(--arancione,255,80,25));
  background:rgba(255,80,25,.08);
  box-shadow:inset 0 0 0 1.4px rgba(255,80,25,.4)}
.dia-mid{flex:1;min-width:0}
.dia-nome{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.025em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dia-meta{display:block;font-size:12.5px;color:var(--hp-testo-3,rgba(255,255,255,.4));
  margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dia-voto{flex:0 0 auto;font-size:13px;font-weight:700;
  color:rgb(var(--arancione,255,80,25))}
.dia-nfoglio{font-size:15px;font-weight:800;letter-spacing:.08em;
  color:var(--hp-testo-3,rgba(255,255,255,.4));min-width:44px;text-align:right}

/* --- il modulo --- */
.dia-modulo{display:grid;gap:14px;padding-top:6px}
.dia-blocco{padding:18px;border-radius:var(--raggio,20px);
  background:var(--vetro-fondo,rgba(255,255,255,.03));
  box-shadow:inset 0 0 0 1px var(--vetro-bordo,rgba(255,255,255,.1))}
.dia-campo{display:block}
.dia-campo+.dia-campo{margin-top:14px}
.dia-et{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--hp-testo-3,rgba(255,255,255,.4));margin-bottom:8px}
.dia-campo input,.dia-campo textarea{width:100%;background:rgba(255,255,255,.04);
  border:0;outline:0;border-radius:13px;padding:13px 15px;
  font-family:inherit;font-size:15px;font-weight:500;color:var(--ink);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);resize:vertical;line-height:1.5;
  transition:box-shadow var(--tempo,200ms) var(--curva,ease)}
.dia-campo input:focus,.dia-campo textarea:focus{
  box-shadow:inset 0 0 0 1px rgba(255,80,25,.5)}
.dia-campo input::placeholder,.dia-campo textarea::placeholder{
  color:rgba(255,255,255,.28)}
.dia-due{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
.dia-due .dia-campo+.dia-campo{margin-top:0}

/* --- forza e cuori --- */
.dia-forza{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dia-f{padding:13px 8px;border-radius:13px;font-size:14px;font-weight:600;
  color:var(--hp-testo-2,rgba(255,255,255,.58));background:rgba(255,255,255,.04);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);
  transition:all var(--tempo,200ms) var(--curva,ease)}
.dia-f[aria-pressed="true"]{color:rgb(var(--arancione,255,80,25));
  background:linear-gradient(90deg,rgba(255,80,25,.2),rgba(255,80,25,.08));
  box-shadow:inset 0 0 0 1px rgba(255,80,25,.4)}
.dia-cuori{display:flex;gap:2px;flex-wrap:wrap}
.dia-c{width:34px;height:38px;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.22);transition:color var(--tempo,200ms) var(--curva,ease),
    transform var(--tempo,200ms) var(--curva,ease)}
.dia-c[aria-pressed="true"]{color:rgb(var(--arancione,255,80,25))}
.dia-c[aria-pressed="true"] svg{fill:rgba(255,80,25,.22)}
.dia-c:active{transform:scale(.86)}
.dia-conta{display:block;font-size:13px;font-weight:700;margin-top:10px;
  color:var(--hp-testo-2,rgba(255,255,255,.58))}

/* --- la foto --- */
.dia-foto{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/3;
  background:rgba(255,255,255,.03);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.dia-foto-vuota{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;cursor:pointer;
  color:var(--hp-testo-3,rgba(255,255,255,.4));font-size:13.5px;font-weight:600}
.dia-foto img{width:100%;height:100%;object-fit:cover;display:none}
.dia-foto.piena img{display:block}
.dia-foto.piena .dia-foto-vuota{display:none}
.dia-foto-x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;
  display:none;align-items:center;justify-content:center;font-size:15px;color:#fff;
  background:rgba(0,0,0,.55);backdrop-filter:blur(10px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.dia-foto.piena .dia-foto-x{display:flex}

/* --- schermo largo --- */
@media (min-width:768px){
  .dia-elenco{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .dia-modulo{max-width:900px;grid-template-columns:1fr 1fr;align-items:start}
  .dia-modulo>.cta,.dia-modulo>.link,.dia-modulo>div{grid-column:1/-1}
  .dia-due{grid-template-columns:1fr 1fr}
  .dia-blocco{padding:22px}
  .dia-num{width:52px;height:52px;border-radius:16px;font-size:15px}
  .dia-nome{font-size:18px}
  .dia-c{width:38px;height:42px}
  .dia-intro{padding:0 0 24px}
}
@media (min-width:1200px){
  .dia-modulo{max-width:1100px}
}
@media (hover:hover) and (pointer:fine){
  .dia-riga:hover{background:var(--vetro-fondo-su,rgba(255,255,255,.055));
    box-shadow:inset 0 0 0 1px var(--vetro-bordo-su,rgba(255,255,255,.16))}
  .dia-f:hover{color:var(--ink)}
  .dia-c:hover{color:rgba(255,80,25,.6)}
}
@media (pointer:coarse){
  .dia-riga{min-height:74px}
  .dia-c{width:36px;height:44px}
  .dia-f{min-height:48px}
}

/* --- ripiego per i browser senza dvh: li serve la misura in JavaScript --- */
@supports not (height:100dvh){
  body{height:var(--vh,100vh)}
}
/* --- niente trascinamento elastico: e un'app, non una pagina web --- */
html,body{overscroll-behavior:none;-webkit-overflow-scrolling:auto}
.hp,.scorre,.fermo,.telo .corpo,.elenco-locali,.foglio{overscroll-behavior:contain}
</style>

/* ---------- colore di ogni ingrediente ---------- */
const TINTE=[

[/vermouth rosso/i,"#8E2226"],[/vermouth dry|vermouth bianco/i,"#DCCF98"],
[/campari|bitter camp/i,"#D22F17"],[/aperol/i,"#F2701A"],[/amaretto|amaro/i,"#6B3319"],
